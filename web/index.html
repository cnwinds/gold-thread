  host.classList.remove("hidden");
  host.innerHTML = `<div class="task-strip"><span class="faint" style="font-size:12px">进行中</span>
    ${running.map(t => `<button type="button" class="chip" onclick="jumpToTasks('${esc(t.id)}')">${esc(t.title)}</button>`).join("")}
    <button type="button" class="ghost" style="font-size:12px" onclick="jumpToTasks('')">查看全部 →</button></div>`;
}

  const sid = Array.isArray(sids) ? sids[0] : null;
  const tab = (t.links && t.links.open_tab) || "gold";
  const dis = st !== "done" ? " disabled" : "";
  const tip = st === "running" ? " title=\"任务进行中，完成后可打开\"" : (st === "failed" ? " title=\"任务失败\"" : "");
  if (!sid && tab !== "train" && tab !== "runs") return st === "running" ? `<span class="faint" style="font-size:12px">分析完成后可查看黄金</span>` : "";
  if (tab === "gold" && sid) {
    return `<button class="primary"${dis}${tip} onclick="if(this.disabled)return;closeDrawer();STATE.pendingGold='${esc(sid)}';setTab('gold')">打开黄金</button>`;

    return `<button class="primary"${dis}${tip} onclick="if(this.disabled)return;closeDrawer();setTab('raw');openRaw('${esc(sid)}')">打开原始</button>`;
  }
  if (tab === "train") {
    return `<button class="primary"${dis}${tip} onclick="if(this.disabled)return;setTab('train')">训练数据</button>`;
  }
  if (tab === "runs") {
    return `<button class="primary"${dis}${tip} onclick="if(this.disabled)return;setTab('runs')">梳理与交付</button>`;
  }
  return "";
}

function taskEffectiveStatus(t) {
  if (!t) return "";
  if (TASK_DETAIL_LOG.id === t.id && TASK_DETAIL_LOG.status) return TASK_DETAIL_LOG.status;
  return t.status || "";
}

let TASK_DETAIL_LOG = { id: "", lines: [], offset: 0, status: "", logInflight: false };

async function pollTaskLogs(taskId) {
  const forTasksUi = STATE.tab === "tasks" && STATE.tasksSelectedId === taskId;
  const forDrawer = RAW_DRAWER.analyzeJobId === taskId;
  if (!forTasksUi && !forDrawer) return;
  if (TASK_DETAIL_LOG.logInflight) return;
  if (forTasksUi && TASK_DETAIL_LOG.id !== taskId) {
    TASK_DETAIL_LOG = { id: taskId, lines: [], offset: 0, status: "", logInflight: false };
    paintTaskLogPanel();
    refreshTaskDetailChrome();
  }
  TASK_DETAIL_LOG.logInflight = true;
  try {
    const off = TASK_DETAIL_LOG.id === taskId ? TASK_DETAIL_LOG.offset : 0;
    const j = await api(`/api/tasks/${encodeURIComponent(taskId)}?offset=${off}`);
    if (forTasksUi && STATE.tasksSelectedId !== taskId) return;
    if (TASK_DETAIL_LOG.id !== taskId) {
      TASK_DETAIL_LOG = { id: taskId, lines: [], offset: 0, status: j.status || "", logInflight: false };
    }
    TASK_DETAIL_LOG.status = j.status || TASK_DETAIL_LOG.status;
    const chunk = j.logs || [];
    if (off === 0) TASK_DETAIL_LOG.lines = chunk.slice();
    else if (chunk.length) TASK_DETAIL_LOG.lines.push(...chunk);
    TASK_DETAIL_LOG.offset = off + chunk.length;
    const idx = TASK_HUB.tasks.findIndex(x => x.id === taskId);
    if (idx >= 0 && j.status) {
      TASK_HUB.tasks[idx] = { ...TASK_HUB.tasks[idx], status: j.status, progress: j.progress || TASK_HUB.tasks[idx].progress };
      if (j.status === "running") TASK_HUB.running = Math.max(TASK_HUB.running, 1);
    }
    if (forTasksUi) {
      refreshTaskDetailChrome();
      paintTaskLogPanel();
    }
    if (forDrawer) paintRawDrawerAnalyze();
  } catch (_) { /* ignore */ }
  finally {
    TASK_DETAIL_LOG.logInflight = false;
  }
}

    const chip = row.querySelector(".chip");

      chip.className = `chip ${st === "done" ? "train" : st === "failed" || st === "stale" ? "neg" : ""}`;
      chip.textContent = RUN_ZH[st] || st;
    }
  }
  updateTasksBadge();
}

function paintTaskLogPanel() {
  const el = $("#taskLogBox");
  if (!el) return;
  const deduped = [];
  for (const l of TASK_DETAIL_LOG.lines) {
    if (deduped.length && deduped[deduped.length - 1] === l) continue;
    deduped.push(l);
  }
  el.innerHTML = deduped.length
    ? deduped.map(l => {
        const cls = /失败|error|Traceback/i.test(l) ? "err" : /\] 完成$/.test(l.trim()) ? "ok" : "";
        return `<div class="${cls}">${esc(l.replace(/^\d{2}:\d{2}:\d{2}\s*/, ""))}</div>`;
      }).join("")
    : `<span class="faint">暂无日志</span>`;
  el.scrollTop = el.scrollHeight;
}

  try {
    const d = await api("/api/tasks");
    TASK_HUB.tasks = d.tasks || [];

    const msg = String(e.message || e);
    const hint = /not found/i.test(msg)
      ? "当前控制台进程仍是旧版本，未加载任务中心 API。请在本机项目根目录重新运行：python serve.py，然后刷新浏览器（Ctrl+F5）。"

    STATE.tasksSelectedId = TASK_HUB.tasks[0].id;

function taskProgressPercent(t) {
  const p = t && t.progress || {};
  const done = Number(p.done ?? p.completed ?? p.current ?? 0);
  const total = Number(p.total ?? p.max ?? 0);
  if (total > 0) return Math.max(0, Math.min(100, Math.round(done / total * 100)));
  if (t && t.status === "done") return 100;
  return null;
}

  const st = taskEffectiveStatus(t);

  return `<button type="button" class="task-row ${t.id === STATE.tasksSelectedId ? "on" : ""}" data-tid="${esc(t.id)}">
    <span class="row" style="gap:8px;margin-bottom:5px">${taskStatusTag(st)}<span class="grow"></span><span class="faint num" style="font-size:10.5px">${esc(ago(t.created_at))}</span></span>

}

async function api(path, opts={}) {
  const res = await fetch(path, {cache: "no-store", headers: {"Content-Type":"application/json"}, ...opts});
  const text = await res.text();
  let data; try { data = text ? JSON.parse(text) : {}; } catch { data = {raw:text}; }
  if (!res.ok) throw new Error(data.error || data.detail || (res.status + " " + res.statusText));
  return data;
}
function toast(msg, kind="") {
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "err" ? 7000 : 3500);
}
function jobStageZh(j) {
  if (j && j.stage === "collect") return j.extra && j.extra.analyze ? "采集并分析" : "采集";
  const m = {analyze:"会话分析", collect:"采集", package:"打包", stage1:"采集", stage2:"黄金提纯", stage3:"训练集合成", all:"全流程", classify:"回合分类"};
  return m[j.stage] || j.stage;
}
function ago(iso) {
  if (!iso) return "未运行";
  const t = new Date(iso).getTime(); if (isNaN(t)) return esc(iso);
  const s = (Date.now() - t) / 1000;
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s/60) + " 分钟前";
  if (s < 86400) return Math.floor(s/3600) + " 小时前";
  return Math.floor(s/86400) + " 天前";
}
const stamp = iso => iso ? String(iso).replace("T", " ").replace(/[+-]\d\d:\d\d$/, "") : "";
function runTag(s) { return `<span class="tag t-${esc(s)}">${esc(RUN_ZH[s] || s)}</span>`; }

function assayBand(raw, gold, win) {
  const max = Math.max(raw, gold, win, 1), H = 104, c = H / 2;
  const h = v => 8 + (H - 12) * Math.sqrt(v / max);
  const [a, b, w] = [h(raw), h(gold), h(win)];
  const X1 = 333.33, X2 = 666.67;
  const top = `M0 ${c-a/2} C 200 ${c-a/2}, 140 ${c-b/2}, ${X1} ${c-b/2} C 530 ${c-b/2}, 470 ${c-w/2}, ${X2} ${c-w/2} L 1000 ${c-w/2}`;
  const bot = `L 1000 ${c+w/2} L ${X2} ${c+w/2} C 470 ${c+w/2}, 530 ${c+b/2}, ${X1} ${c+b/2} C 140 ${c+b/2}, 200 ${c+a/2}, 0 ${c+a/2} Z`;
  return `<svg class="band ${STATE.poured ? "static" : ""}" viewBox="0 0 1000 ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="g-flow" x1="0" x2="1000" y1="0" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="${COLORS.ore}" stop-opacity=".55"/>
        <stop offset=".333" stop-color="${COLORS.gold}" stop-opacity=".85"/>
        <stop offset=".667" stop-color="${COLORS.mint}" stop-opacity=".8"/>
        <stop offset="1" stop-color="${COLORS.mint}" stop-opacity=".25"/>
      </linearGradient>
      <pattern id="g-strata" width="1000" height="6" patternUnits="userSpaceOnUse">
        <rect width="1000" height="1" fill="#000" opacity=".14"/>
      </pattern>
    </defs>
    <path d="${top} ${bot}" fill="url(#g-flow)"/>
    <path d="${top} ${bot}" fill="url(#g-strata)"/>
    ${[0, X1, X2].map(x => `<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="#313845" vector-effect="non-scaling-stroke"/>`).join("")}
  </svg>`;
}

/* ------------------------------ 原始数据 ------------------------------ */
function adoptCell(s) {
  if (!s.adopted) {
    return `<div class="adopt"><span class="chip">未分析</span><span class="faint">尚未生成黄金</span></div>`;
  }
  const st = SCRIPT_ZH[s.gold_status] || "已分析";
  const when = s.analyzed_at ? ` title="分析于 ${esc(stamp(s.analyzed_at))}"` : "";
  return `<div class="adopt"${when}><span class="chip train">已分析</span><span class="faint">${esc(st)}</span></div>`;
}
function kb(n) {
  n = Number(n) || 0;
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  return Math.max(1, Math.round(n / 1024)) + " KB";
}
function syncPickButtons() {
  const n = (STATE.raw.pickIds || []).length;
  const suffix = n ? `（${n}）` : "";
  const ingest = $("#pickIngest");
  const analyze = $("#pickGo");
  if (ingest) ingest.textContent = `采集所选${suffix}`;
  if (analyze) analyze.textContent = `采集并分析${suffix}`;
}
function togglePick(id, on) {
  const ids = new Set(STATE.raw.pickIds || []);
  if (on) ids.add(id); else ids.delete(id);
  STATE.raw.pickIds = [...ids];
  syncPickButtons();
}
function pickGroupLabel(project, origin) {
  const p = String(project || "").trim();
  if (!p) return "未命名项目";
  if (origin === "cursor") return p.replace(/^d-/, "").replace(/-/g, " · ");
  if (p.startsWith("--D--")) return p.slice(5).replace(/-/g, " · ");
  if (p.includes("\\") || p.includes("/")) {
    const parts = p.split(/[/\\]/).filter(Boolean);
    return parts[parts.length - 1] || p;
  }
  return p;
}
function pickGroupKey(s) {
  return String(s.project || s.id.split("/")[0] || "其他");
}
function filterPickRows(rows, filter) {
  if (filter === "new") return rows.filter(s => !s.adopted);
  if (filter === "adopted") return rows.filter(s => s.adopted);
  return rows;
}
function groupPickRows(rows) {
  const map = new Map();
  for (const s of rows) {
    const k = pickGroupKey(s);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(s);
  }
  return [...map.entries()]
    .map(([key, items]) => ({
      key,
      label: pickGroupLabel(key, items[0]?.origin),
      items: items.sort((a, b) => String(b.timestamp).localeCompare(String(a.timestamp))),
      latest: items.reduce((m, s) => (String(s.timestamp) > m ? String(s.timestamp) : m), ""),
    }))
    .sort((a, b) => b.latest.localeCompare(a.latest));
}
function pickOpenSet() {
  return new Set(STATE.raw.pickOpen || []);
}
function setPickGroupOpen(key, open) {
  const s = pickOpenSet();
  if (open) s.add(key); else s.delete(key);
  STATE.raw.pickOpen = [...s];
}
function bindPickGroups() {
  $$("#pickList .pick-group-h").forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const g = btn.closest(".pick-group");
      const key = g?.dataset.gkey;
      if (!key) return;
      const open = !g.classList.contains("open");
      g.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open);
      setPickGroupOpen(key, open);
    };
  });
}
function renderPickList(rows, ids, pickOn) {
  const groups = groupPickRows(rows);
  if (!groups.length) return `<div class="empty">没有符合条件的会话</div>`;
  const open = pickOpenSet();
  if (pickOn) {
    for (const g of groups) {
      if (g.items.some(s => s.id === pickOn)) open.add(g.key);
    }
    STATE.raw.pickOpen = [...open];
  }
  return groups.map(g => {
    const isOpen = open.has(g.key);
    return `<div class="pick-group ${isOpen ? "open" : ""}" data-gkey="${esc(g.key)}">
    <button type="button" class="pick-group-h" aria-expanded="${isOpen}">
      <span class="caret"></span>
      <span class="grow" style="min-width:0"><b>${esc(g.label)}</b></span>
      <span class="faint">${fmt(g.items.length)} 条</span>
    </button>
    <div class="pick-group-body">
    ${g.items.map(s => `<div class="pick-row ${pickOn===s.id?"on":""}" data-id="${esc(s.id)}" data-gkey="${esc(g.key)}">
      <input type="checkbox" data-pick="${esc(s.id)}" ${ids.has(s.id)?"checked":""} aria-label="选择">
      <div>
        <div class="pick-title">${esc(s.title || s.session_id)}</div>
        <div class="faint" style="font-size:11px;margin-top:2px">${stamp(s.timestamp)} · ${kb(s.bytes)}
          ${s.adopted ? ` · <span class="chip train">已加入</span>` : ""}</div>
      </div>
    </div>`).join("")}
    </div>
  </div>`;
  }).join("");
}
async function openPickPreview(id) {
  STATE.raw.pickOn = id;

function buildRawAnalyzeFootBody(sid) {
  const job = rawAnalyzeJobMeta();
  const jobHere = !!(job && RAW_DRAWER.sid === sid);
  if (!jobHere) return "";
  const running = job.status === "running";
  const done = job.status === "done";
  const failed = job.status === "failed";
  const prog = job?.progress || {};
  const pct = prog.total > 0 ? Math.min(100, Math.round(100 * (prog.done || 0) / prog.total)) : null;
  if (running) {
    return `<div class="session-job-status"><span class="rb-live"></span><span>分析中</span>
      <span class="faint num" id="rawAnalyzeElapsed">${formatAnalyzeElapsed(Date.now() - (RAW_DRAWER.analyzeStarted || Date.now()))}</span>
      ${pct != null ? `<span class="session-job-track"><i style="width:${pct}%"></i></span><span class="faint num">${pct}%</span>` : ""}
      <button type="button" class="ghost slim" onclick="jumpToTasks('${esc(RAW_DRAWER.analyzeJobId || "")}')">日志</button>
    </div>`;
  }
  if (done) return `<span class="session-job-ok">分析完成</span>`;
  if (failed) return `<span class="session-job-error" title="${esc(job?.error || "分析失败")}">分析失败</span>`;
  return "";
}

function renderSessionActionsFoot(kind, sid) {

  return `<div class="session-actions">

async function startAnalyzeJob(sid, stayInDrawer = false) {
  if (RAW_DRAWER.analyzeJobId && JOB_META?.status === "running") {
    toast("这条会话已在分析中", "err");
    return;
  }
  try {
    const {job_id} = await api(`/api/raw/session/${sid}/analyze`, {method:"POST"});
    RAW_DRAWER.analyzeJobId = job_id;
    RAW_DRAWER.analyzeStarted = Date.now();
    RAW_DRAWER.sid = sid;
    RAW_DRAWER.feedback = null;
    startRawAnalyzeTimer();
    watchJob(job_id, j => {
      stopRawAnalyzeTimer();
      if (j.status === "done") {
        RAW_DRAWER.adopted = true;
        loadRaw().catch(() => {});
        refreshMeta().catch(() => {});
        if (RAW_DRAWER.sid === sid && $("#drawer").classList.contains("open")) {
          openRaw(sid).catch(() => {});
        }
      }
      if (j.status !== "running") {
        setTimeout(() => {
          if (RAW_DRAWER.analyzeJobId === job_id && j.status === "done") RAW_DRAWER.analyzeJobId = null;
        }, j.status === "done" ? 3000 : 0);
      }
      paintRawDrawerAnalyze();
    });
    if (stayInDrawer) {
      paintRawDrawerAnalyze();
      toast(`已开始分析 ${sid.slice(0, 8)}，下方可看进度`, "ok");
    } else {
      toast(`正在分析 ${sid.slice(0, 8)}`, "ok");
    }
  } catch (e) { toast(e.message, "err"); }
}

/* ------------------------------ 黄金数据 / 人工复核 ------------------------------ */
function effCtl(cur, counts) {
  return `<div class="seg-ctl" id="goldEff">${[["","全部",counts.all],["queue","待复核",counts.queue],["pass","已通过",counts.pass],["block","不入库",counts.block],["unreviewed","未评审",counts.unreviewed]]
    .map(([v,t,n]) => `<button data-v="${v}" class="${cur===v?"on":""}">${t}${n?` <span class="num">${n}</span>`:""}</button>`).join("")}</div>`;
}
function lcsDiff(a, b) {
  const n = a.length, m = b.length;
  if (n * m > 250000) return null;
  const dp = Array.from({length: n + 1}, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push(["eq", a[i]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push(["del", a[i++]]); }
    else ops.push(["ins", b[j++]]);
  }
  while (i < n) ops.push(["del", a[i++]]);
  while (j < m) ops.push(["ins", b[j++]]);
  return ops;
}
function tokenPair(l, r) {
  const cut = s => s.match(/[A-Za-z0-9_./:+#-]+|\s+|[\u4e00-\u9fff]|./g) || [];
  const ops = lcsDiff(cut(l), cut(r));
  if (!ops) return {l:`<del>${esc(l)}</del>`, r:`<ins>${esc(r)}</ins>`};
  let L = "", R = "";
  for (const [op, t] of ops) {
    if (op === "eq") { L += esc(t); R += esc(t); }
    else if (op === "del") L += `<del>${esc(t)}</del>`;
    else R += `<ins>${esc(t)}</ins>`;
  }
  return {l:L, r:R};
}
function buildDiff(oldS, newS, caps) {
  oldS = String(oldS ?? ""); newS = String(newS ?? "");
  const capL = (caps && caps[0]) || "原文", capR = (caps && caps[1]) || "模型改写";
  if (oldS === newS) return {html:`<div class="faint">两边相同</div>`, changes:0};
  const ops = lcsDiff(oldS.split("\n"), newS.split("\n"));
  const box = (l, r) => `<div class="diff-grid"><div><div class="diff-cap">${capL}</div><div class="diff">${l}</div></div><div><div class="diff-cap">${capR}</div><div class="diff">${r}</div></div></div>`;
  if (!ops) return {html: box(esc(oldS), esc(newS)), changes:-1};
  const rows = [];
  for (let k = 0; k < ops.length;) {
    if (ops[k][0] === "eq") { rows.push({l:esc(ops[k][1]), r:esc(ops[k][1]), eq:true}); k++; continue; }
    const dels = [], ins = [];
    while (k < ops.length && ops[k][0] !== "eq") { (ops[k][0] === "del" ? dels : ins).push(ops[k][1]); k++; }
    for (let t = 0; t < Math.max(dels.length, ins.length); t++) {
      const lt = dels[t], rt = ins[t];
      if (lt != null && rt != null) { const td = tokenPair(lt, rt); rows.push({l:td.l, r:td.r, eq:false}); }
      else rows.push({l: lt != null ? `<del>${esc(lt)}</del>` : "", r: rt != null ? `<ins>${esc(rt)}</ins>` : "", eq:false});
    }
  }
  const L = [], R = [];
  for (let i = 0; i < rows.length;) {
    if (!rows[i].eq) { L.push(rows[i].l); R.push(rows[i].r); i++; continue; }
    let j = i; while (j < rows.length && rows[j].eq) j++;
    if (j - i > 6) {
      L.push(rows[i].l, `<span class="faint">… ${j - i - 2} 行未改</span>`, rows[j - 1].l);
      R.push(rows[i].r, `<span class="faint">… ${j - i - 2} 行未改</span>`, rows[j - 1].r);
    } else for (let t = i; t < j; t++) { L.push(rows[t].l); R.push(rows[t].r); }
    i = j;
  }
  return {html: box(L.join("\n"), R.join("\n")), changes: rows.filter(r => !r.eq).length};
}
/* 左右栏滚动联动：按比例同步，事件捕获委托，自动覆盖所有 .diff-grid（DPO 对照 / 复核改写卡） */
let DIFF_SYNC_LOCK = 0;
document.addEventListener("scroll", e => {
  const el = e.target;
  if (!(el instanceof Element) || !el.classList.contains("diff")) return;
  const grid = el.closest(".diff-grid");
  if (!grid || Date.now() < DIFF_SYNC_LOCK) return;
  const boxes = grid.querySelectorAll(":scope > div > .diff");
  if (boxes.length !== 2) return;
  const other = boxes[0] === el ? boxes[1] : boxes[0];
  const maxA = el.scrollHeight - el.clientHeight, maxB = other.scrollHeight - other.clientHeight;
  if (maxA > 2 && maxB > 2) {
    other.scrollTop = Math.round((el.scrollTop / maxA) * maxB);
    DIFF_SYNC_LOCK = Date.now() + 60;
  }
}, true);

function cheapGist(a, b) {
  const A = String(a ?? "").split("\n"), B = String(b ?? "").split("\n");
  for (let i = 0; i < Math.max(A.length, B.length); i++) if ((A[i] || "") !== (B[i] || "")) return short(oneLine(B[i] || A[i] || "有改动"), 72);
  return "有改动";
}
function revItem(mid) { return REV.items[mid] || (REV.items[mid] = {rewrite:null, edited_text:"", step:null, comment:""}); }
function revItemsPayload() {
  const out = {};
  for (const [mid, it] of Object.entries(REV.items)) out[mid] = {
    rewrite: it.rewrite || null,
    edited_text: it.rewrite === "edited" ? (it.edited_text || "") : null,
    step: it.step || null,
    comment: it.comment || null,

  return out;
}
async function revFlush() {

  const sid = REV.sid, items = revItemsPayload(), note = REV.note;
  REV.dirty = false;

}
function revTouch() {

function revInput(el) {

function revSync(mid) {

    card.querySelectorAll("button[data-rev]").forEach(b => b.classList.toggle("rev-on", b.dataset.rev === it.rewrite || b.dataset.rev === it.step));

  });

/* ---- 逐条评审队列：按对话顺序收集全部改写/问题步 ---- */
function reviewQueue() {
  const mids = [];
  for (const t of Object.values(FLOW.traces)) for (const st of t.steps) {
    const mid = st.m && st.m.id;
    if (mid && (REV.rewritten.has(mid) || REV.bad.has(mid))) mids.push(mid);
  }
  return mids;
}
function revDone(mid) {
  const it = REV.items[mid];
  return !!(it && (it.rewrite || it.step || (it.comment || "").trim()));
}
function revProgress() {
  const mids = reviewQueue();
  return { total: mids.length, done: mids.filter(mid => revDone(mid)).length };
}
function revSyncProg() {
  const p = revProgress();
  $$("[data-revprog]").forEach(el => { el.textContent = `${p.done} / ${p.total}`; });
}
function revNext(mid) {
  const mids = reviewQueue();
  if (!mids.length) { toast("没有待评审的改写或问题步"); return; }
  const start = Math.max(0, mids.indexOf(mid));
  for (let k = 1; k <= mids.length; k++) {
    const cand = mids[(start + k) % mids.length];
    if (!revDone(cand)) { jumpMsg(cand); return; }
  }
  toast("全部改写与问题步都已处置 ✓", "ok");
}
function revAct(btn) {
  const mid = btn.dataset.mid, kind = btn.dataset.rev, it = revItem(mid);
  if (kind === "exclude" || kind === "keep") it.step = it.step === kind ? null : kind;
  else if (it.rewrite === kind) it.rewrite = null;
  else {
    it.rewrite = kind;
    if (kind === "edited" && !it.edited_text) it.edited_text = REV.modelRw[mid] || REV.originals[mid] || "";
  }
  revSync(mid);
  const card = btn.closest("[data-revcard]");
  const p = card && card.querySelector("[data-pill]");
  if (p) { p.classList.remove("pill-pulse"); void p.offsetWidth; p.classList.add("pill-pulse"); }
  if (it.rewrite === "edited") {
    const tas = [...document.querySelectorAll(`[data-revcard="${CSS.escape(mid)}"] textarea.rev-editbox`)];
    const ta = tas.find(t => !t.classList.contains("hidden")) || tas[0];
    if (ta) { if (!ta.value) ta.value = it.edited_text || ""; ta.focus(); }
  }
  revTouch();
}
function revLazy(el) {
  if (!el.open) return;
  $$(".diff-slot", el).forEach(slot => {
    if (slot.dataset.done) return;
    const p = REV.pairs[slot.dataset.pair];
    slot.innerHTML = p ? buildDiff(p.old, p.new, p.caps).html : "";
    slot.dataset.done = "1";

}

  }
}

async function goldSetStepGate(mid, step) {
  const sid = STATE.drawerData?.record?.session_id;
  if (!sid || !mid) return;
  const items = (STATE.drawerData?.annotation?.human_review?.items) || {};
  const cur = { ...(items[mid] || {}) };
  if (cur.step === "exclude") delete cur.step;
  else if (step === "exclude") cur.step = "exclude";
  try {
    await api(`/api/gold/session/${encodeURIComponent(sid)}/review/items`, {
      method: "PUT",
      body: JSON.stringify({ items: { [mid]: cur }, note: null }),
    });
    toast(cur.step === "exclude" ? "已排除该步（生成训练集时不计入）" : "已取消排除", "ok");
    openGold(sid);
    refreshMeta().catch(() => {});
  } catch (e) { toast(e.message, "err"); }
}
function renderGoldStepGate(messages, annotation) {
  const items = (annotation?.human_review?.items) || {};
  const asst = (messages || []).filter(m => m && m.role === "assistant" && m.id);
  if (!asst.length) return "";
  const rows = asst.map((m, i) => {
    const excluded = items[m.id]?.step === "exclude";
    const hint = short(m.thinking || m.text || "", 72);
    return `<tr>
      <td class="n">${i + 1}</td>
      <td class="mono faint">${esc(String(m.id).slice(0, 8))}</td>
      <td class="muted">${esc(hint || "—")}</td>
      <td>${excluded ? `<span class="lb no">已排除</span>` : `<span class="faint">保留</span>`}</td>
      <td><button type="button" class="ghost" style="padding:2px 8px;font-size:11.5px" data-gold-mid="${esc(m.id)}">${excluded ? "取消排除" : "排除此步"}</button></td>
    </tr>`;
  }).join("");
  return `<details class="panel gold-gate"><summary class="panel-h"><h3>步级排除</h3>
    <span class="hint">${asst.length} 步 · 排除后不进入 SFT，血缘仍保留</span></summary>
    <div class="panel-b scroll" style="max-height:260px;padding-top:0"><table><thead><tr>
      <th class="n">#</th><th>步</th><th>摘要</th><th>状态</th><th></th>

}

/* ------------------------------ 消息渲染 ------------------------------ */
/* 会话按「提问 → 执行过程 → 回复」重组：执行过程默认折叠，逐层展开到单步的完整思考与工具输出。 */
const TURN_KIND_ZH = {root:"根任务", task:"新任务", continuation:"续接", correction:"纠偏", setup:"准备", noise:"噪音"};
const FLOW = {items: [], traces: {}, mode: "talk", q: "", openTraces: new Set(), openSteps: new Set(), turnKinds: {}};

const oneLine = s => String(s ?? "").replace(/\s+/g, " ").trim();
const firstLine = s => oneLine(String(s ?? "").split(/\n\s*\n|\n/).find(l => l.trim()) || "");
const hhmm = iso => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toTimeString().slice(0, 5) : ""; };
const chars = n => n >= 10000 ? (n / 10000).toFixed(1) + " 万字" : fmt(n) + " 字";
function dur(ms) {
  if (!(ms > 0)) return "";
  const s = ms / 1000;
  return s < 60 ? Math.round(s) + " 秒" : s < 3600 ? Math.round(s / 60) + " 分钟" : (s / 3600).toFixed(1) + " 小时";
}
function hl(s) {
  s = String(s ?? "");
  const q = FLOW.q;
  if (!q) return esc(s);
  const low = s.toLowerCase();
  let out = "", i = 0, j;
  while ((j = low.indexOf(q, i)) !== -1) { out += esc(s.slice(i, j)) + "<mark>" + esc(s.slice(j, j + q.length)) + "</mark>"; i = j + q.length; }
  return out + esc(s.slice(i));
}
function mdInline(s) {
  return hl(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
}
function md(src) {
  const lines = String(src ?? "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre class="md-code">${hl(buf.join("\n"))}</pre>`); continue;
    }
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = Math.min(h[1].length + 2, 6); out.push(`<h${n}>${mdInline(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(l); i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<div class="md-table"><table><thead><tr>${head.map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${
        rows.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l), buf = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) buf.push(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${buf.map(b => `<li>${mdInline(b)}</li>`).join("")}</${tag}>`); continue;
    }
    if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`); continue;
    }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^\s*(```|#{1,6}\s|\||>|[-*+]\s|\d+[.)]\s)/.test(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out.push(`<p>${buf.map(mdInline).join("<br>")}</p>`);
  }
  return out.join("");
}
function callGist(c) {
  const a = c.arguments;
  if (a && typeof a === "object") {
    const v = a.command ?? a.path ?? a.file_path ?? a.filePath ?? a.pattern ?? a.query ?? Object.values(a).find(x => typeof x === "string");
    return v != null ? String(v) : JSON.stringify(a);
  }
  return a != null ? String(a) : (c.result?.content || "");
}

function buildFlow(msgs) {
  const items = [], traces = {};
  const covered = new Set(msgs.flatMap(m => (m.tool_results || []).map(r => r.tool_call_id)));
  let cur = null, seq = 0, lastTurn = null;
  const flush = () => { if (cur && cur.steps.length) { items.push(cur); traces[cur.id] = cur; } cur = null; };
  const open = turn => cur || (cur = {type: "trace", id: "tr" + (++seq), turn, steps: []});
  const addStep = (m, calls) => {
    const no = cur.steps.length + 1;
    const think = m?.thinking || "";
    const blob = [think, m?.text, ...calls.flatMap(c => [c.name, JSON.stringify(c.arguments ?? ""), c.result?.content])].join("\n").toLowerCase();
    cur.steps.push({id: `${cur.id}-${no}`, no, m, calls, think, blob,
      err: calls.some(c => c.result?.isError),
      flagged: !!(m && (m.pruned_detour || m.folded_from || (m.flags || []).length))});
  };
  for (const m of msgs) {
    if (m.role === "system") { flush(); items.push({type: "system", m}); continue; }
    if (m.role === "user") { flush(); lastTurn = m.turn_index; items.push({type: "user", m}); continue; }
    if (m.role === "tool") {
      if (covered.has(m.tool_call_id)) continue;
      open(m.turn_index ?? lastTurn);
      const call = {id: m.tool_call_id, name: m.name, arguments: null, result: m};
      const last = cur.steps[cur.steps.length - 1];
      if (last) { last.calls.push(call); last.err ||= !!m.isError; last.blob += "\n" + String(m.content || "").toLowerCase(); }
      else addStep(null, [call]);
      continue;
    }
    if (m.thinking || (m.tool_calls || []).length) {
      open(m.turn_index ?? lastTurn);
      const res = Object.fromEntries((m.tool_results || []).map(r => [r.tool_call_id, r]));
      addStep(m, (m.tool_calls || []).map(tc => ({id: tc.id, name: tc.name, arguments: tc.arguments, result: res[tc.id]})));
    }
    const said = m.text || (typeof m.content === "string" ? m.content : "");
    if (said) { flush(); items.push({type: "reply", m, text: said}); }
  }
  flush();
  return {items, traces};
}

function traceStats(t) {
  const calls = t.steps.reduce((a, s) => a + s.calls.length, 0);
  const errors = t.steps.reduce((a, s) => a + s.calls.filter(c => c.result?.isError).length, 0);
  const think = t.steps.reduce((a, s) => a + s.think.length, 0);
  const names = {};
  t.steps.forEach(s => s.calls.forEach(c => names[c.name] = (names[c.name] || 0) + 1));
  const first = t.steps[0], last = t.steps[t.steps.length - 1];
  const t0 = new Date(first.m?.timestamp || first.calls[0]?.result?.timestamp);
  const lastCall = last.calls[last.calls.length - 1];
  const t1 = new Date(lastCall?.result?.timestamp || last.m?.timestamp);
  const hits = FLOW.q ? t.steps.filter(s => s.blob.includes(FLOW.q)).length : 0;
  return {calls, errors, think, names: Object.entries(names).sort((a, b) => b[1] - a[1]), span: t1 - t0, hits};
}

function renderMessages(msgs, turns) {
  const {items, traces} = buildFlow(msgs);
  Object.assign(FLOW, {items, traces, q: "", turnKinds: Object.fromEntries((turns || []).map(t => [t.turn_index, t.kind]))});
  applyFlowMode(FLOW.mode, false);
  const count = type => items.filter(i => i.type === type).length;
  const steps = Object.values(traces).reduce((a, t) => a + t.steps.length, 0);
  return `<div class="panel flow" id="flowPanel">
    <div class="flow-h">
      <div><h3>对话</h3><div class="hint">${count("user")} 次提问，${fmt(steps)} 个助手步骤，${count("reply")} 条回复</div></div>
      <span class="grow"></span>
      <input type="search" id="flowQ" placeholder="搜索思考、命令与输出" oninput="flowSearch(this.value)">
      <div class="seg-ctl" id="flowMode">${[["talk", "对话", "只看提问与回复，执行过程折叠"], ["steps", "步骤", "展开执行过程，每步一行"], ["full", "完整", "展开每一步的思考与工具输出"]]
        .map(([v, t, tip]) => `<button data-v="${v}" title="${tip}" class="${FLOW.mode === v ? "on" : ""}" onclick="applyFlowMode('${v}')">${t}</button>`).join("")}</div>
    </div>
    <div class="flow-b" id="flowBody">${renderFlowBody()}</div>
  </div>`;
}

function applyFlowMode(mode, rerender = true) {
  FLOW.mode = mode;
  const ids = Object.keys(FLOW.traces);
  FLOW.openTraces = new Set(mode === "talk" ? [] : ids);
  FLOW.openSteps = new Set(mode === "full" ? ids.flatMap(id => FLOW.traces[id].steps.map(s => s.id)) : []);
  if (!rerender) return;
  $$("#flowMode button").forEach(b => b.classList.toggle("on", b.dataset.v === mode));
  $("#flowBody").innerHTML = renderFlowBody();
}

let FLOW_TIMER = null;
function flowSearch(v) {
  clearTimeout(FLOW_TIMER);
  FLOW_TIMER = setTimeout(() => { FLOW.q = v.trim().toLowerCase(); $("#flowBody").innerHTML = renderFlowBody(); }, 220);
}

function renderFlowBody() {
  return FLOW.items.map(it => {
    const m = it.m;
    if (it.type === "system") {
      return `<details class="sys"><summary>系统提示词 <span class="faint">${chars((m.content || "").length)}</span></summary>
        <div class="sys-body">${hl(m.content || "")}</div></details>`;
    }
    if (it.type === "user") {
      const ti = m.turn_index, kind = FLOW.turnKinds[ti], text = m.content || "", long = text.length > 700;
      return `<div class="bubble user" ${ti != null ? `id="turn-${ti}"` : ""}>
        <div class="who"><span class="role">用户</span>${ti != null ? `<span class="chip">回合 #${ti}</span>` : ""}${kind ? `<span>${esc(TURN_KIND_ZH[kind] || kind)}</span>` : ""}
          <span class="grow"></span><time>${hhmm(m.timestamp)}</time></div>
        <div class="txt ${long ? "clamp" : ""}">${hl(text)}</div>
        ${long ? `<button class="ghost more" onclick="this.previousElementSibling.classList.toggle('clamp');this.textContent=this.textContent==='展开全文'?'收起':'展开全文'">展开全文</button>` : ""}
      </div>`;
    }
    if (it.type === "reply") {
      const long = it.text.length > 900 && !(FLOW.q && it.text.toLowerCase().includes(FLOW.q));
      return `<div class="bubble reply">
        <div class="who"><span class="role">助手回复</span>${m.model ? `<span class="mono">${esc(m.model)}</span>` : ""}<span class="grow"></span><time>${hhmm(m.timestamp)}</time></div>
        <div class="md ${long ? "clamp" : ""}">${md(it.text)}</div>
        ${long ? `<button class="ghost more" onclick="this.previousElementSibling.classList.toggle('clamp');this.textContent=this.textContent==='展开全文'?'收起':'展开全文'">展开全文</button>` : ""}
      </div>`;
    }
    return renderTrace(it);
  }).join("") || `<div class="empty">这个会话没有消息</div>`;
}

function renderTrace(t) {
  const s = traceStats(t);
  const q = FLOW.q;
  const open = FLOW.openTraces.has(t.id) || (q && s.hits > 0);
  const maxThink = Math.max(1, ...t.steps.map(x => x.think.length));
  const visible = q ? t.steps.filter(x => x.blob.includes(q)) : t.steps;
  const ticks = t.steps.map(st => {
    const h = 5 + Math.round(17 * Math.sqrt(st.think.length / maxThink));
    const tip = `#${st.no} ${firstLine(st.think) || oneLine(callGist(st.calls[0] || {}))}`.slice(0, 140);
    const cls = [st.err && "e", st.flagged && "f", q && (st.blob.includes(q) ? "hit" : "dim")].filter(Boolean).join(" ");
    return `<i class="tk ${cls}" style="height:${h}px" title="${esc(tip)}" onclick="jumpStep('${t.id}','${st.id}')"></i>`;
  }).join("");
  return `<div class="trace ${open ? "open" : ""}" id="${t.id}">
    <div class="trace-head">
    <button class="trace-bar" aria-expanded="${!!open}" onclick="toggleTrace('${t.id}')">
      <span class="caret"></span>
      <span class="tt">执行过程 <b class="num">${t.steps.length}</b> 步</span>
      <span class="tm">
        ${t.turn != null ? `<span>回合 #${t.turn}</span>` : ""}
        <span>工具调用 <b class="num">${s.calls}</b> 次</span>
        ${s.errors ? `<span class="e">报错 <b class="num">${s.errors}</b> 次</span>` : ""}
        <span>思考 ${chars(s.think)}</span>
        ${dur(s.span) ? `<span>用时 ${dur(s.span)}</span>` : ""}
        ${s.names.slice(0, 3).map(([n, c]) => `<span class="mono">${esc(n)} ${c}</span>`).join("")}
      </span>
      ${q ? `<span class="hits ${s.hits ? "" : "none"}">${s.hits ? `命中 ${s.hits} 步` : "无命中"}</span>` : ""}
    </button>
    <div class="ticks" aria-hidden="true">${ticks}</div>
    </div>
    ${open ? `<div class="steps-list">${visible.map(renderStep).join("")}</div>` : ""}
  </div>`;
}

function effectiveThinking(mid, m) {
  const it = REV.items[mid];
  if (it && it.rewrite === "accepted") return REV.modelRw[mid] || (m && m.thinking) || "";
  if (it && it.rewrite === "edited") return it.edited_text || (m && m.thinking) || "";
  return (m && m.thinking) || "";
}
function stepMarksHtml(mid) {
  const it = REV.items[mid] || {};
  const disp = it.rewrite === "accepted" ? `<span class="lb ok">已采纳</span>`
    : it.rewrite === "rejected" ? `<span class="lb no">不采纳</span>`
    : it.rewrite === "edited" ? `<span class="lb gold">手改</span>`
    : it.step === "exclude" ? `<span class="lb no">将排除</span>`
    : it.step === "keep" ? `<span class="lb keep">保留</span>` : "";
  const ctx = [
    REV.bad.has(mid) ? `<span class="lb prune">问题步</span>` : "",
    REV.rewritten.has(mid) ? `<span class="lb backfill">有改写</span>` : "",
  ].filter(Boolean).join(" ");
  return (disp ? disp + " " : "") + ctx;
}
function renderStep(st) {
  const open = FLOW.openSteps.has(st.id);
  const mid = st.m && st.m.id;
  const marked = REV.active && mid;
  const done = marked && revDone(mid);
  const gist = firstLine(st.think) || firstLine(st.m?.text);
  const marks = marked ? stepMarksHtml(mid) : "";
  const calls = st.calls.slice(0, 2).map(c =>
    `<span class="call ${c.result?.isError ? "e" : ""}"><b>${esc(c.name)}</b>${hl(short(oneLine(callGist(c)), 90))}</span>`).join("");
  return `<div class="step ${open ? "open" : ""} ${st.err ? "err" : ""} ${st.flagged ? "flagged" : ""} ${marked && REV.bad.has(mid) ? "rev-bad" : ""} ${marked && REV.rewritten.has(mid) ? "rev-rw" : ""} ${done ? "rev-done" : ""}" id="${st.id}">
    <button class="step-row" aria-expanded="${open}" onclick="toggleStep('${st.id}')">
      <span class="no num">${st.no}</span>
      <span class="gist">${marked ? `<span class="marks">${marks}</span> ` : ""}<span data-gisttxt>${gist ? hl(short(gist, 160)) : `<span class="faint">没有思考内容</span>`}</span></span>
      <span class="calls">${calls || `<span class="faint">无工具调用</span>`}${st.calls.length > 2 ? `<span class="more-calls">+${st.calls.length - 2}</span>` : ""}</span>
    </button>
    ${open ? renderStepDetail(st) : ""}
  </div>`;
}

function renderStepDetail(st) {
  const m = st.m || {};
  const flags = (m.flags || []).map(f => `<span class="lb ${f.includes("fold") ? "fold" : f.includes("prune") ? "prune" : "backfill"}">${esc(f)}</span>`).join("");
  const meta = [
    m.model && `<span class="mono">${esc(m.model)}</span>`,
    m.quality && `<span>质量 <span class="num">${fmt(m.quality.score)}</span>${m.quality.is_clean ? "，干净" : ""}</span>`,
    flags,
    m.pruned_detour && `<span class="lb prune">pruned:${esc(m.pruned_detour.slice(0, 8))}</span>`,
    m.folded_from && `<span class="lb fold">folded:${esc(m.folded_from.slice(0, 8))}</span>`,
    `<span class="grow"></span>`,
    m.timestamp && `<time>${hhmm(m.timestamp)}</time>`,
    m.id && `<span class="mono">${esc(String(m.id).slice(0, 14))}</span>`,
  ].filter(Boolean).join("");
  const calls = st.calls.map(c => {
    const r = c.result, err = r?.isError, out = r?.content || "", len = r?.raw_len ?? out.length;
    const a = c.arguments;
    const args = a == null ? "" : (typeof a === "object" && typeof a.command === "string" && Object.keys(a).length <= 2)
      ? `<pre class="cmd">${hl(a.command)}</pre>`
      : `<pre class="cmd">${hl(typeof a === "string" ? a : JSON.stringify(a, null, 2))}</pre>`;
    const openOut = err || out.length < 600 || (FLOW.q && out.toLowerCase().includes(FLOW.q));
    return `<div class="call-d ${err ? "e" : ""}">
      <div class="call-h"><b>${esc(c.name || "")}</b>${err ? `<span class="lb err">报错</span>` : ""}<span class="grow"></span><span class="mono faint">${esc(String(c.id || "").slice(0, 18))}</span></div>
      ${args}
      ${r ? `<details ${openOut ? "open" : ""}><summary>输出 ${fmt(len)} 字符</summary><pre>${hl(out)}</pre></details>` : `<div class="no-out">没有输出记录</div>`}
    </div>`;
  }).join("");
  const it = (REV.active && m.id) ? (REV.items[m.id] || {}) : {};
  const hasRw = REV.active && m.id && REV.rewritten.has(m.id);
  const oldS = REV.originals[m.id] || "", scriptS = REV.scripts[m.id] || m.thinking || "", neu = REV.modelRw[m.id] || "";
  let rwPairKey = "";
  if (hasRw) {
    const kM = "rw-model:" + m.id, kS = "rw-script:" + m.id;
    REV.pairs[kS] = REV.pairs[kS] || {old: oldS, new: scriptS, caps:["原始会话", "脚本提纯"]};
    REV.pairs[kM] = REV.pairs[kM] || {old: scriptS, new: neu, caps:["脚本提纯", "模型改写"]};
    rwPairKey = kM;
  }
  const on = name => (it.rewrite === name || it.step === name) ? "rev-on" : "";
  const pillTxt = it.step==="exclude"?"将排除":it.step==="keep"?"强制保留":it.rewrite==="edited"?"手改":it.rewrite==="accepted"?"已采纳改写":it.rewrite==="rejected"?"不采纳改写":"按质量门控";
  const reviewBox = REV.active && m.id ? `<div class="step-review" data-revcard="${esc(m.id)}">
    <div class="row"><span class="faint">训练去向</span>
      ${hasRw ? `<button data-rev="accepted" data-mid="${esc(m.id)}" class="${on("accepted")}" onclick="revAct(this)">采纳改写</button>
      <button data-rev="rejected" data-mid="${esc(m.id)}" class="${on("rejected")}" onclick="revAct(this)">不采纳</button>` : ""}
      <button data-rev="edited" data-mid="${esc(m.id)}" class="${on("edited")}" onclick="revAct(this)">手改</button>
      <button data-rev="exclude" data-mid="${esc(m.id)}" class="${on("exclude")}" onclick="revAct(this)">排除此步</button>
      <button data-rev="keep" data-mid="${esc(m.id)}" class="${on("keep")}" onclick="revAct(this)">强制保留</button>
      <button class="ghost" onclick="revNext('${esc(m.id)}')" title="跳到下一个未处置的改写/问题步">处理下一个</button>
      <span class="grow"></span>
      ${hasRw ? `<span class="faint num">原始 ${chars(oldS.length)} · 当前 ${chars(scriptS.length)} · 改写 ${chars(neu.length)}</span>` : ""}
      <span class="chip" data-pill data-default="按质量门控">${pillTxt}</span>
    </div>
    ${hasRw ? `
    <details class="rw-diff" ontoggle="revLazy(this)"><summary>精确差异（当前版 → 模型改写提案，绿为补、红为删）</summary>
      <div class="diff-slot" data-pair="${esc(rwPairKey)}" style="margin-top:7px"></div>
    </details>` : ""}
    <textarea class="rev-editbox ${it.rewrite==="edited"?"":"hidden"}" data-field="edit" data-mid="${esc(m.id)}" oninput="revInput(this)"
      placeholder="直接写最终进入训练集的 thinking">${esc(it.edited_text || REV.modelRw[m.id] || m.thinking || "")}</textarea>
    <textarea class="rev-comment" data-field="comment" data-mid="${esc(m.id)}" oninput="revInput(this)"
      placeholder="修改意见。拒绝或写下意见后，可以让模型按意见重做这一步">${esc(it.comment||"")}</textarea>
  </div>` : "";
  const effThink = (REV.active && m.id) ? effectiveThinking(m.id, m) : (m.thinking || "");
  const effChanged = effThink !== (m.thinking || "");
  return `<div class="step-d">
    <div class="step-meta">${meta}</div>
    ${effThink ? `<div class="row ${effChanged ? "" : "hidden"}" data-thinknote style="margin:2px 0 6px"><span class="lb ok">已显示生效版本</span><span class="faint" style="font-size:11px">采纳/手改后的内容，通过后将进入训练集</span></div>
    <div class="think-full" data-thinkfull>${hl(effThink)}</div>
    ${effChanged ? `<details class="think-orig" data-thinkorig><summary>查看脚本提纯原版 · ${chars((m.thinking || "").length)}</summary><pre>${hl(m.thinking || "")}</pre></details>` : ""}` : ""}
    ${m.text ? `<div class="said md">${md(m.text)}</div>` : ""}
    ${calls}
    ${reviewBox}
  </div>`;
}

function rerenderTrace(id) {
  const el = document.getElementById(id);
  if (el) el.outerHTML = renderTrace(FLOW.traces[id]);
  return document.getElementById(id);
}
function toggleTrace(id) {
  FLOW.openTraces.has(id) ? FLOW.openTraces.delete(id) : FLOW.openTraces.add(id);
  const el = rerenderTrace(id);
  if (el && el.getBoundingClientRect().top < $("#drawerBody").getBoundingClientRect().top) { el.scrollIntoView({block: "start"}); $("#drawerBody").scrollTop -= 12; }
}
function toggleStep(id) {
  FLOW.openSteps.has(id) ? FLOW.openSteps.delete(id) : FLOW.openSteps.add(id);
  const t = FLOW.traces[id.split("-")[0]];
  const st = t.steps.find(s => s.id === id);
  const el = document.getElementById(id);
  if (el && st) el.outerHTML = renderStep(st);
}
function jumpStep(tid, sid) {
  FLOW.openTraces.add(tid); FLOW.openSteps.add(sid);
  const st = FLOW.traces[tid].steps.find(s => s.id === sid);
  if (FLOW.q && !st.blob.includes(FLOW.q)) { FLOW.q = ""; const i = $("#flowQ"); if (i) i.value = ""; $("#flowBody").innerHTML = renderFlowBody(); }
  else rerenderTrace(tid);
  const el = document.getElementById(sid);
  if (!el) return;
  el.scrollIntoView({block: "start"});
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1400);
}
function jumpMsg(mid) {
  for (const t of Object.values(FLOW.traces)) {
    const st = t.steps.find(s => s.m && s.m.id === mid);
    if (st) { jumpStep(t.id, st.id); return; }
  }
  toast("这一步不在当前对话里");
}
function jumpTurn(ti) {
  const el = document.getElementById("turn-" + ti);
  if (el) el.scrollIntoView({block: "start", behavior: "smooth"});
  else toast(`回合 #${ti} 在消息流中没有独立的提问，已被折叠进相邻回合或剥离`);
}

function datasetKind(name) {
  if (name.includes("dpo")) return "dpo";
  if (name.includes("diagnostic")) return "diagnostic";
  if (name.includes("trajectories")) return "trajectory";
  return "sft";
}
const DS_KIND_ZH = {sft:"SFT 单步",trajectory:"完整轨迹",dpo:"DPO 偏好",diagnostic:"病态诊断"};
const DRAFT_KIND_ZH = {sft:"SFT", trajectory:"轨迹", dpo:"DPO 偏好对", diagnostic:"诊断"};
function trainRequestCurrent(request) {
  return request.id === TRAIN_REQUEST_SEQ && STATE.train.workspace === request.workspace;
}
function replanNeedsSave(preview, current) {
  if (Object.keys(preview.changes || {}).length) return true;
  const plan = preview.split_plan || {};
  const base = preview.base_plan || current || {};
  if (Number(plan.eval_ratio) !== Number(base.eval_ratio)) return true;
  if (Number(plan.seed) !== Number(base.seed)) return true;

}

async function loadTrainBuilds() {
  const d = await api("/api/dataset/builds");
  STATE.train.builds = d.builds || [];
  const host = $("#draftBuild");

async function replanSplit(dryRun) {
  const plan = STATE.train.splitPlan || {};
  const ratio = Number($("#draftEvalRatio")?.value ?? plan.eval_ratio ?? 0);
  const seed = Number($("#draftSeed")?.value ?? plan.seed ?? 42);
  const body = {eval_ratio: ratio, seed, dry_run: !!dryRun};
  if (!dryRun) body.expected_hash = (STATE.train.replanPreview && STATE.train.replanPreview.base_hash) || undefined;
  const preview = await api("/api/dataset/draft/split/replan", {method:"POST", body: JSON.stringify(body)});
  if (dryRun) {
    STATE.train.replanPreview = preview;
    const saveBtn = $("#draftReplanSave");
    if (saveBtn) saveBtn.disabled = !replanNeedsSave(preview, plan);
    toast(Object.keys(preview.changes || {}).length ? `预览 ${Object.keys(preview.changes).length} 项变更` : "预览：切分参数无项目变更", "ok");
    return preview;
  }
  STATE.train.replanPreview = null;
  await loadTrainDraft();
  return preview;
}

/* 每份文件从哪来。编号对得上的才写成「来自某文件」，对不上的只写制作方式。 */
const TRAIN_YAML = {
  "sft.train.lf.jsonl": "train_sft.yaml 读取",
  "sft.eval.lf.jsonl": "train_sft.yaml 读取",
  "dpo.train.lf.jsonl": "train_dpo.yaml 读取",
  "dpo.eval.lf.jsonl": "train_dpo.yaml 读取",
};
const TRAIN_FAMILIES = [["sft","单步 SFT"],["traj","完整轨迹"],["dpo","DPO"],["diag","病态诊断"]];
function dsFamily(name) {
  if (name.includes("diagnostic")) return "diag";
  if (name.includes("dpo")) return "dpo";
  if (name.includes("traject")) return "traj";
  return "sft";
}
function dsRelation(name) {
  const yaml = TRAIN_YAML[name] || "";
  const family = dsFamily(name);
  if (name.endsWith(".lf.jsonl")) {
    return {family, from: name.replace(/\.lf\.jsonl$/, ".jsonl"), how: "同一批样本。连续的工具结果已合并，训练框架读的是这一份", yaml};
  }
  if (name.endsWith(".v2w.jsonl")) {
    return {family, from: name.replace(/\.v2w\.jsonl$/, ".v2.jsonl"), how: "从修订稿裁短窗口的一版", yaml};
  }
  if (name.endsWith(".v2.jsonl")) {
    return {family, from: name.replace(/\.v2\.jsonl$/, ".jsonl"), how: "修订稿。在合成稿上改过，重跑 stage3 不会写回这里", yaml};
  }
  if (name.startsWith("dpo_w.")) {
    const sp = name.includes(".eval.") ? "eval" : "train";
    return {family, from: `dpo.${sp}.jsonl`, how: "上机 DPO 的窗口裁剪版，条数和原文件不完全相同", yaml};
  }
  if (/^(sft|dpo)\.(train|eval)\.jsonl$/.test(name)) {
    return {family, from: "发布包", how: "发布时用的短名字。sample_id 已重写，不能按编号对回修订稿", yaml};
  }
  if (name.includes("openai")) {
    return {family, from: name.replace("openai", "sharegpt"), how: "同一批单步样本的 OpenAI 写法", yaml};
  }
  if (/\.(train|eval)\.jsonl$/.test(name)) {
    const src = name.replace(/\.(train|eval)\.jsonl$/, ".jsonl");
    const sp = name.includes(".eval.") ? "验证" : "训练";
    return {family, from: src, how: `按项目整包切出的${sp}部分`, yaml};
  }
  if (family === "diag") return {family, from: "黄金会话里的病态步", how: "只供查看。勾选后才会加入生成", yaml};
  if (family === "dpo") return {family, from: "黄金偏好对", how: "stage3 从剪枝、复核改写和来源会话的病态步合成，训练和验证混在这一份", yaml};
  if (family === "traj") return {family, from: "黄金会话", how: "stage3 保留的整段轨迹", yaml};
  return {family, from: "黄金会话", how: "stage3 切成单步窗口，训练和验证混在这一份", yaml};
}
function trainRelText(name) {
  const rel = dsRelation(name);
  return `来自 ${rel.from}。${rel.how}${rel.yaml ? "。" + rel.yaml : ""}`;
}
function dsRank(name) {
  if (name.endsWith(".lf.jsonl")) return 50;
  if (name.startsWith("dpo_w.")) return 45;
  if (/^(sft|dpo)\.(train|eval)\.jsonl$/.test(name)) return 40;
  if (name.includes(".v2w.")) return 30;
  if (name.includes(".v2.")) return 20;
  if (/\.(train|eval)\.jsonl$/.test(name)) return 10;
  return 0;
}
function applyTrainList() {
  const tf = STATE.train;
  const n = (tf.fileq || "").trim().toLowerCase();
  $$("#view-train .ds-row").forEach(row => {
    const name = row.dataset.name;
    const blob = `${name} ${row.dataset.from || ""}`.toLowerCase();
    const qmiss = !!n && !blob.includes(n);
    row.classList.toggle("ds-hide", qmiss);
  });
  $$("#view-train .ds-group").forEach(g => {
    g.classList.toggle("ds-hide", !g.querySelector(".ds-row:not(.ds-hide)"));
  });
  const empty = $("#dsEmpty");
  if (empty) empty.classList.toggle("ds-hide", !!$("#view-train .ds-row:not(.ds-hide)"));
}
function renderTrainPlan(list) {
  const picked = list || [];
  const sum = pred => picked.filter(x => pred(x.name)).reduce((a, x) => a + (Number(x.rows) || 0), 0);
  const bits = picked.map(x => `<span class="chip train">${esc(x.name.replace(/\.jsonl$/, ""))} <b>${x.rows == null ? "—" : fmt(x.rows)}</b></span>`).join("");
  const sftN = sum(n => dsFamily(n) === "sft" || dsFamily(n) === "traj");
  const dpoN = sum(n => dsFamily(n) === "dpo");
  return `<div class="train-plan" id="trainPlan">
    <b>历史文件 ${picked.length} 份</b>
    <span class="faint">SFT ${fmt(sftN)} 条 · DPO ${fmt(dpoN)} 条</span>
    <span class="grow"></span>
    ${bits || `<span class="faint">Stage 3 写入的 jsonl 会出现在左侧列表。</span>`}
  </div>`;
}
function renderDatasetIndex(list) {
  const rowHtml = x => {
    const rel = dsRelation(x.name);
    const on = x.name === STATE.train.name;
    return `<div class="ds-row ${on ? "on" : ""}" data-name="${esc(x.name)}" data-from="${esc(rel.from)}">
      <button type="button" class="ds-open" data-name="${esc(x.name)}" title="${esc(x.name + "\n" + trainRelText(x.name))}">
        <span class="ds-file mono">${esc(x.name.replace(/\.jsonl$/, ""))}</span>
        <span class="ds-from">来自 ${esc(rel.from)}</span>
      </button>
      <b class="ds-num">${x.rows == null ? "—" : fmt(x.rows)}</b>
    </div>`;
  };
  const groups = TRAIN_FAMILIES.map(([id, title]) => {
    const rs = list.filter(x => dsFamily(x.name) === id).slice().sort((a, b) => dsRank(a.name) - dsRank(b.name) || a.name.localeCompare(b.name));
    if (!rs.length) return "";
    return `<div class="ds-group" data-family="${id}"><div class="ds-group-h">${esc(title)}</div>${rs.map(rowHtml).join("")}</div>`;
  }).join("");
  return `<aside class="train-rail">
    <div class="train-rail-h">
      <input id="dsFile" type="text" placeholder="筛选文件名或来源" value="${esc(STATE.train.fileq || "")}">
    </div>
    <div class="train-rail-scroll">
      ${groups}
      <div id="dsEmpty" class="empty ds-hide"><h3>没有匹配的文件</h3></div>
    </div></aside>`;
}

function trainRow(r,kind) {
  const m=r.metadata||{}, p=r.preview||{};
  const fromGold = m.session_id ? `黄金会话 ${m.session_id.slice(0,8)}` : "";
  const base=`<td class="n faint">${r.index}</td>
    <td><div class="mono muted" style="font-size:11px" title="${esc(r.sample_id)}">${esc(short(r.sample_id,28))}</div><div class="sid faint">${esc(m.project_group||"")}</div>${fromGold?`<div class="ds-from">${esc(fromGold)}</div>`:""}</td>`;
  if(kind==="dpo") return `<tr class="clickable" data-idx="${r.index}" tabindex="0">${base}
    <td><span class="chip">${esc(DPO_SRC_ZH[m.source]||m.source||"–")}</span><div class="faint" style="margin-top:3px">${esc(m.reason||"")}</div></td>

/* ShareGPT/OpenAI 训练样本 -> 黄金数据内部消息结构，复用 renderMessages 流式对话视图 */
function convToMsgs(list) {
  const msgs = [];
  let pending = [];
  let seq = 0;
  const nid = p => `${p}_${++seq}`;
  for (const raw of (list || [])) {
    const from = raw.from || raw.role || "";
    const val = raw.value ?? (typeof raw.content === "string" ? raw.content : JSON.stringify(raw.content ?? ""));
    if (from === "system") { msgs.push({role: "system", content: val, timestamp: ""}); continue; }
    if (from === "human" || from === "user") { msgs.push({role: "user", content: val, timestamp: ""}); continue; }
    if (from === "observation" || from === "tool") {
      const call = pending.shift();
      const rec = {role: "tool", tool_call_id: call?.id || raw.tool_call_id || nid("tr"), name: call?.name || raw.name || "tool",
        isError: !!(raw.isError), content: val, timestamp: ""};
      const last = msgs[msgs.length - 1];
      if (last && last.role === "assistant") (last.tool_results ||= []).push(rec);
      msgs.push(rec);
      continue;
    }
    let think = raw.reasoning_content || "";
    let text = String(val ?? "");
    const tm = text.match(/^<think>?\s*\n?([\s\S]*?)\n?<\/think>\s*/i);
    if (tm) { if (!think) think = tm[1].trim(); text = text.slice(tm[0].length).trim(); }
    const calls = [];
    text = text.replace(/<tool_call>\s*([\s\S]*?)\s*<\/tool_call>/gi, (_, body) => {
      try { const o = JSON.parse(body); calls.push({id: nid("call"), name: o.name || "tool", arguments: o.arguments ?? {}}); }
      catch { calls.push({id: nid("call"), name: "tool", arguments: {raw: body}}); }
      return "";
    }).trim();
    for (const tc of (raw.tool_calls || [])) {
      const f = tc.function || tc;
      let args = f.arguments;
      if (typeof args === "string") { try { args = JSON.parse(args); } catch {} }
      calls.push({id: tc.id || nid("call"), name: f.name || "tool", arguments: args ?? {}});
    }
    pending = calls.map(c => ({id: c.id, name: c.name}));
    msgs.push({role: "assistant", thinking: think, text, tool_calls: calls, tool_results: [], model: raw.model || "", timestamp: ""});
  }
  return msgs;
}

function renderTrainDetail(row,kind,fileName) {
  const meta=row.metadata||row;
  const rel = dsRelation(fileName || "");
  const sid = meta.session_id || "";
  const sampleId = row.sample_id || meta.sample_id || "";
  const also = (row._lineage && row._lineage.same_sample) || [];
  const lines = [];
  if (sid) lines.push(`<div class="origin-line"><span class="k">黄金会话</span><button type="button" class="ghost" id="jumpGold" data-sid="${esc(sid)}">${esc(sid)}</button></div>`);
  if (meta.project_group) lines.push(`<div class="origin-line"><span class="k">项目</span><span>${esc(meta.project_group)}</span></div>`);
  if (meta.split) lines.push(`<div class="origin-line"><span class="k">切分</span><span>${esc(meta.split)}</span></div>`);
  if (meta.source) lines.push(`<div class="origin-line"><span class="k">生成原因</span><span>${esc(DPO_SRC_ZH[meta.source] || meta.source)}</span></div>`);
  if (meta.reason) lines.push(`<div class="origin-line"><span class="k">理由</span><span>${esc(meta.reason)}</span></div>`);
  if (meta.stage) {

    lines.push(`<div class="origin-line"><span class="k">阶段</span><span>${esc(ph ? ph[1] : meta.stage)}</span></div>`);
  }
  lines.push(`<div class="origin-line"><span class="k">这份文件</span><span>来自 ${esc(rel.from)}。${esc(rel.how)}</span></div>`);
  if (also.length) lines.push(`<div class="origin-line"><span class="k">同一编号</span><span class="origin-files">${also.map(f=>`<button type="button" class="ghost jump-file" data-name="${esc(f)}" data-q="${esc(sampleId)}">${esc(f.replace(/\.jsonl$/,""))}</button>`).join("")}</span></div>`);
  else if (sampleId) lines.push(`<div class="origin-line"><span class="k">同一编号</span><span class="faint">其他文件里没有这个 sample_id</span></div>`);
  const metaPanel=`<div class="panel"><div class="panel-h"><h3>这条从哪来</h3></div><div class="panel-b">${lines.join("")}</div></div>`;
  if(kind==="dpo"){
    const pref = v => (v == null ? "" : typeof v === "string" ? v : (v.value || ""));
    const chosen=pref(row.chosen), rejected=pref(row.rejected);
    return `${metaPanel}<div class="panel"><div class="panel-h"><h3>偏好对照</h3><span class="hint">相同上下文下，模型应偏好左侧 chosen</span></div>
      <div class="panel-b">${buildDiff(rejected,chosen,["Rejected · 不应学习","Chosen · 目标行为"]).html}</div></div>
      <div class="note" style="margin:10px 0">与黄金数据相同的对话视图 · 这是偏好对触发时所见的上下文，chosen / rejected 目标回复不在其中</div>
      ${renderMessages(convToMsgs(row.conversations || row.messages))}`;
  }
  if(kind==="diagnostic") return `${metaPanel}<div class="panel"><div class="panel-h"><h3>病态思考原文</h3></div>
    <div class="panel-b"><div class="path-chips" style="margin-bottom:10px">${(row.pathologies||[]).map(x=>`<span>${esc(PATHO_ZH[String(x).split(":")[0]]||x)}</span>`).join("")}</div>
    <div class="think-full">${esc(row.thinking||row.thinking_preview||"")}</div></div></div>
    <div class="panel"><div class="panel-h"><h3>工具动作</h3></div><div class="panel-b mono">${esc((row.tool_calls||[]).join("\n")||"无")}</div></div>`;
  return `${metaPanel}<div class="note" style="margin-bottom:10px">与黄金数据相同的对话视图 · 历史 thinking 已剥离，窗口内最后一条助手步为训练目标（计算 loss）</div>
    ${renderMessages(convToMsgs(row.conversations || row.messages))}`;
}

const cfgGet = (obj, p) => p.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
const cfgFmt = (f, v) => f.digits != null ? Number(v).toFixed(f.digits) : String(v);

function cfgLoadValues() {
  CFG.values = {}; CFG.dirty = {};
  CFG_SECS.forEach(s => s.fields.forEach(f => {
    const v = cfgGet(CFG.parsed, f.p);
    CFG.values[f.p] = v === undefined
      ? (f.k === "tags" ? [] : f.k === "bool" ? false : f.k === "num" ? 0 : f.k === "model" ? "" : Number(f.min || 0))
      : (f.k === "range" || f.k === "num") ? Number(v) : v;
  }));
}
function cfgResolve(path, seen) {
  seen = seen || {};
  if (seen[path]) return "";
  seen[path] = 1;
  const f = cfgFind(path);
  const v = CFG.values[path];
  if (v) return v;
  if (f && f.inherit) return cfgResolve(f.inherit, seen);
  return v || "";
}
function cfgFind(p) { for (const s of CFG_SECS) for (const f of s.fields) if (f.p === p) return f; return null; }
function cfgDirtyCount() { return CFG_SECS.reduce((a, s) => a + s.fields.filter(f => CFG.dirty[f.p]).length, 0); }
function cfgSecDirty(sec) { return sec.fields.some(f => CFG.dirty[f.p]); }
function cfgMarkDirty(path) {
  const cur = CFG.values[path], base = cfgGet(CFG.parsed, path);
  const changed = JSON.stringify(cur) !== JSON.stringify(base === undefined ? (cfgFind(path).k === "tags" ? [] : cur) : base);
  CFG.dirty[path] = changed;
  cfgPaintDirty();
}
function cfgPaintDirty() {
  const n = cfgDirtyCount();
  $$(".cfg-row").forEach(r => { const p = r.dataset.path; if (p) r.classList.toggle("is-dirty", !!CFG.dirty[p]); });
  $$(".cfg-nav").forEach(b => {
    const sec = CFG_SECS.find(s => s.id === b.dataset.sec);
    if (sec) b.classList.toggle("is-dirty", cfgSecDirty(sec));
  });
  const bar = $("#cfgSaveBar");
  if (bar) {
    bar.classList.toggle("hide", n === 0);
    const c = bar.querySelector("[data-cnt]");
    if (c) c.textContent = `${n} 项未保存`;
  }
}
function cfgInput(el) {
  const p = el.dataset.cfg, f = cfgFind(p);
  if (!f) return;
  if (f.k === "bool") CFG.values[p] = el.checked;
  else if (f.k === "range" || f.k === "num") { const n = Number(el.value); if (!Number.isNaN(n)) CFG.values[p] = n; }
  else CFG.values[p] = el.value;
  const out = el.parentElement.querySelector("[data-val]");
  if (out && (f.k === "range")) out.textContent = cfgFmt(f, CFG.values[p]);
  if (p === "llm.model" || p.endsWith("_model") || p.startsWith("judge.task_models.")) {
    cfgRepaintPipe();
    cfgRepaintModelFollows();

}

function cfgControl(f) {
  const v = CFG.values[f.p];
  if (f.k === "bool") return `<label class="cfg-sw"><input type="checkbox" data-cfg="${esc(f.p)}" ${v ? "checked" : ""} onchange="cfgInput(this)"><span></span></label>`;
  if (f.k === "range") return `<input type="range" class="cfg-range" min="${f.min}" max="${f.max}" step="${f.step || 1}" data-cfg="${esc(f.p)}" value="${v}" oninput="cfgInput(this)"><span class="cfg-val" data-val>${cfgFmt(f, v)}</span>`;

    const prov = (CFG.models.find(m => m.id === cfgResolve(f.p)) || {}).provider || "";
    return `<select data-cfg="${esc(f.p)}" onchange="cfgInput(this)">${opts.join("")}</select>${prov ? `<span class="cfg-inherit">${esc(prov)}</span>` : ""}`;

function cfgTagKey(e, p) {
  if (e.key !== "Enter" && e.key !== ",") return;
  e.preventDefault();
  const val = e.target.value.trim();
  if (!val) return;
  if (!Array.isArray(CFG.values[p])) CFG.values[p] = [];
  if (CFG.values[p].includes(val)) { toast("已存在", "err"); return; }
  CFG.values[p].push(val); e.target.value = "";
  cfgRepaintTags(p); cfgMarkDirty(p);
}
function cfgTagDel(p, i) { CFG.values[p].splice(i, 1); cfgRepaintTags(p); cfgMarkDirty(p); }
function cfgRepaintTags(p) {
  $$(`.cfg-tags[data-tags="${CSS.escape(p)}"]`).forEach(box => {
    box.querySelectorAll(".cfg-tag").forEach(x => x.remove());
    const input = box.querySelector(".cfg-tag-in");
    CFG.values[p].forEach((t, i) => {
      const s = document.createElement("span");
      s.className = "cfg-tag";

}
function cfgRowHtml(f) {
  return `<div class="cfg-row" data-path="${esc(f.p)}">

function cfgSecHtml(s) {
  const q = CFG.q.toLowerCase();

  const main = s.fields.filter(f => !f.adv && hit(f));
  const adv = s.fields.filter(f => f.adv && hit(f));
  if (!main.length && !adv.length) return "";
  return `<section class="cfg-sec" id="cfgsec-${s.id}" data-sec="${s.id}">
    <div class="cfg-sec-h"><h3>${esc(s.name)}</h3><span class="hint">${esc(s.hint || "")}</span>
      <span class="cnt">${s.fields.length} 项</span></div>
    ${s.pipe ? `<div class="cfg-pipe" id="cfgPipe">${cfgPipeHtml()}</div>` : ""}
    ${main.map(cfgRowHtml).join("")}
    ${adv.length ? `<details class="cfg-adv" ${CFG.advOpen[s.id] || q ? "open" : ""} ontoggle="CFG.advOpen['${s.id}']=this.open">

}
function cfgRailHtml() {

function cfgGoto(id) {
  CFG.sec = id;
  const navs = $$(".cfg-nav");
  navs.forEach(b => b.classList.toggle("on", b.dataset.sec === id));
  const el = document.getElementById("cfgsec-" + id);

  const sc = $("#cfgScroll") || $(".cfg-scroll");
  if (sc && sc.scrollHeight > sc.clientHeight + 4) {
    const top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 6;
    sc.scrollTo({top: Math.max(0, top), behavior: "smooth"});
  } else {
    // 容器不可滚（窄屏 / 内容不足）时退回页面滚动
    el.scrollIntoView({block: "start", behavior: "smooth"});
  }
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
async function cfgSave() {

    const r = await api("/api/config/structured", {method:"POST", body: JSON.stringify({values})});

    cfgLoadValues(); cfgPaintDirty();
    loadConfig();

}
function cfgDiscard() { cfgLoadValues(); loadConfig(); }

/* ------------------------------ 运行（Master-Detail 轨道） ------------------------------ */
const RB_STATUS = {
  done:    ["已完成", "done"],
  running: ["正在做", "run"],
  ready:   ["待执行", "ready"],
  todo:    ["未开始", "todo"],
  warn:    ["需处理", "warn"],
};
const RW_UI = { selectedPhase: null, openStep: null };

function rwPhaseState(p) {
  if (p.steps.some(s => s.status === "running")) return "run";
  if (p.steps.some(s => s.status === "warn")) return "warn";
  if (p.done >= p.total && p.total > 0) return "done";
  return "todo";
}

function rwDefaultPhase(rb) {
  if (rb.job && rb.job.progress?.id) {
    const ph = (rb.phases || []).find(p => p.steps.some(s => s.id === rb.job.progress.id));
    if (ph) return ph.id;
  }
  if (rb.next?.phase) return rb.next.phase;
  if (rb.deliverable?.zip_path) return "delivery";
  return (rb.phases?.[0] && rb.phases[0].id) || "stage1";
}

function selectRwPhase(id) {
  RW_UI.selectedPhase = id;
  RW_UI.openStep = null;
  if (STATE.runbook) renderRunsView(STATE.runbook, STATE.runHist || { runs: [] });
}

function toggleRwStep(id) {
  RW_UI.openStep = RW_UI.openStep === id ? null : id;
  if (STATE.runbook) renderRunsView(STATE.runbook, STATE.runHist || { runs: [] });
}

function jumpToGold(eff="queue") {
  STATE.gold.model = "";
  STATE.gold.output = "";
  STATE.gold.project = "";
  STATE.gold.q = "";
  STATE.gold.eff = eff;
  setTab("gold");
}

function jumpToRaw() {
  STATE.raw.model = "";
  STATE.raw.adopted = "";
  STATE.raw.project = "";
  STATE.raw.q = "";
  setTab("raw");
}

function jumpToTrain(dsName="") {
  if (dsName) STATE.train.name = dsName;
  STATE.train.offset = 0;
  setTab("train");
}

function jumpToRuns() {
  setTab("runs");
}

function rwStepActions(s) {
  const acts = [];
  if (s.phase === "stage1") {
    if (s.status !== "done") acts.push(`<button class="primary" onclick="event.stopPropagation();runStage('stage1',false)">运行 Stage 1</button>`);
    acts.push(`<button class="ghost" onclick="event.stopPropagation();jumpToRaw()">查看原始会话</button>`);
  } else if (s.phase === "stage2") {
    if (s.status === "warn" || s.status === "ready") {
      acts.push(`<button class="primary" onclick="event.stopPropagation();runStage('stage2',false)">运行 Stage 2 补齐</button>`);
    }
    acts.push(`<button onclick="event.stopPropagation();jumpToGold('')">去黄金数据页查看</button>`);
  } else if (s.phase === "stage3") {
    if (s.id === "s3.package") {
      acts.push(`<button class="primary" onclick="event.stopPropagation();exportPackage()"${PACK.running ? " disabled" : ""}>${PACK.running ? "打包中…" : "生成交付 zip"}</button>`);
    } else if (s.status === "warn" || s.status === "ready") {
      acts.push(`<button class="primary" onclick="event.stopPropagation();runStage('stage3',false)">运行 Stage 3</button>`);
    }
    if (s.id === "s3.dpo_review") {
      acts.push(`<button onclick="event.stopPropagation();jumpToTrain('dpo_preference_pairs.jsonl')">查看 DPO 样本</button>`);
    } else if (s.id === "s3.handoff") {
      acts.push(`<button onclick="event.stopPropagation();openHandoff()">查看 handoff.md</button>`);
    } else {
      acts.push(`<button class="ghost" onclick="event.stopPropagation();jumpToTrain()">查看训练数据</button>`);
    }
  }
  return acts.join("");
}

function rwInlineJump(s) {
  if (s.status !== "warn" && s.status !== "ready") return "";
  if (s.phase === "stage2") {
    return `<button style="padding:3px 10px;font-size:11.5px" onclick="event.stopPropagation();runStage('stage2',false)">续跑补齐 →</button>
      <button class="ghost" style="padding:3px 8px;font-size:11.5px" onclick="event.stopPropagation();jumpToGold('')">查看 →</button>`;
  }
  if (s.id === "s3.dpo_review") {
    return `<button style="padding:3px 10px;font-size:11.5px" onclick="event.stopPropagation();runStage('stage3',false)">续跑 →</button>`;
  }
  if (s.id === "s3.package") {
    return `<button style="padding:3px 10px;font-size:11.5px" onclick="event.stopPropagation();exportPackage()"${PACK.running ? " disabled" : ""}>${PACK.running ? "打包中…" : "打包 →"}</button>`;
  }
  return "";
}

function rwStageAction(phaseId, rb) {
  if (phaseId === "stage1") return `<button onclick="jumpToRaw()">查看原始数据</button><button onclick="runStage('stage1',false)">运行 Stage 1</button>`;
  if (phaseId === "stage2") return `<button onclick="jumpToGold('')">查看黄金数据</button><button onclick="runStage('stage2',false)">运行 Stage 2</button>`;
  if (phaseId === "stage3") return `<button onclick="jumpToTrain()">查看训练集</button><button onclick="runStage('stage3',false)">运行 Stage 3</button>`;
  return "";
}

function rwRenderStageDetail(p, rb) {
  const focusId = rb.job?.progress?.id || rb.next?.id;

  return `<div class="rw-stage">
    <div class="rw-stage-h">

    <div>
      ${p.steps.map(s => {
        const [stxt, scls] = RB_STATUS[s.status] || RB_STATUS.todo;
        const isFocus = s.id === focusId;
        const isOpen = s.id === openId;
        const mark = s.status === "done" ? "✓" : s.status === "running" ? "▶" : s.status === "warn" ? "!" : "·";
        const jumpBtn = rwInlineJump(s);
        return `<div class="rw-step ${scls} ${isFocus ? "focus" : ""} ${isOpen ? "open" : ""}">
          <div class="rw-step-row" onclick="toggleRwStep('${s.id}')">
            <span class="rs-mark">${mark}</span>
            <span class="rs-title">
              <span class="rs-label">${esc(s.label)}</span>
              <span class="rb-owner o-${s.owner === "模型" ? "m" : s.owner === "人工" ? "h" : "p"}">${esc(s.owner)}</span>

            <span class="rs-chev">▶</span>
          </div>
          <div class="rw-step-detail">
            <div>${esc(s.detail || "")}</div>
            <div class="rs-meta">
              ${s.output ? `<span>产出：${esc(s.output)}</span>` : ""}
              ${s.hint ? `<span>状态：${esc(s.hint)}</span>` : ""}

        </div>`;
      }).join("")}
    </div>
  </div>`;

function exportProfileList(rb) {
  return (rb && rb.export_profiles) || [];
}
function currentExportProfile(rb) {
  const ids = exportProfileList(rb).map(p => p.id);
  if (PACK.profileChosen && PACK.profile && (!ids.length || ids.includes(PACK.profile))) return PACK.profile;
  const zipId = rb && rb.deliverable && rb.deliverable.format && rb.deliverable.format.profile;
  if (zipId && ids.includes(zipId)) return zipId;

  if (STATE.runbook) renderRunsView(STATE.runbook);
}
function formatMismatchNote(del, selectedId) {
  if (!del.zip_path) return "";
  const fmt = del.format;
  if (!fmt || !fmt.profile) {
    return `<br><span class="faint">当前 zip 打包时还没有格式契约。按上面选的格式重新打包后，工具调用、template、parser 会锁成一套。</span>`;
  }
  if (fmt.profile !== selectedId) {
    return `<br><span class="faint">可下载的包是 <b>${esc(fmt.label || fmt.profile)}</b>。上面选的是另一种格式，要点「按此格式重新打包」才会换。</span>`;
  }
  const n = fmt.blocks_converted;
  const rewritten = (n || n === 0) ? `，改写了 ${esc(n)} 处工具调用` : "";
  return `<br><span class="faint">这份 zip 已是 ${esc(fmt.label || fmt.profile)}（template ${esc(fmt.train_template || "")}，parser ${esc(fmt.serve_tool_parser || "")}${rewritten}）。</span>`;
}

      body: `<span id="packPhase">${esc(PACK.phase || "正在整理数据集与训练配置…")}</span><span class="faint" id="packElapsed">已用时 <b>${PACK.elapsed}</b> 秒</span>`,
