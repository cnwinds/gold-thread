            ${del.handoff_exists ? `<button class="ghost" onclick="openHandoff()">使用说明</button>` : ""}
          </div>
        </div>
        <div class="delivery-status ${card.readyClass}" id="packStatus">
          <b id="packTitle">${card.title}</b><div id="packBody">${card.body}</div>
        </div>
        <dl class="delivery-meta">
          <div><dt>当前包格式</dt><dd>${esc(fmtLabel)}</dd></div>
          <div><dt>文件名</dt><dd class="mono" title="${esc(del.zip_name || "")}">${esc(del.zip_name || "待生成")}</dd></div>
          <div><dt>体积</dt><dd>${mb}</dd></div>
          <div><dt>生成时间</dt><dd>${esc(stamp(del.zip_generated_at) || "—")}</dd></div>
          <div><dt>内容指纹</dt><dd class="mono">${esc(del.package_hash || "—")}</dd></div>
          <div><dt>配置版本</dt><dd class="mono">${esc(String(rb.config_hash || "").slice(0, 8) || "—")}</dd></div>
        </dl>
      </div>
    </section>
  </div>
  <section class="panel delivery-history">
    <div class="panel-h"><h3>历史打包</h3><span class="hint">每一次生成结果都可单独下载</span></div>
    ${packHistHtml()}
  </section>`;
}
function packHistHtml() {
  const packs = (STATE.packHist && STATE.packHist.packs) || [];
  const cell = n => n == null ? "—" : fmt(n);
  const rows = packs.map(p => {
    const mb = p.size_bytes ? (p.size_bytes / (1024 * 1024)).toFixed(1) + " MB" : "—";
    return `<tr>
      <td class="mono" style="font-size:11px">${esc(p.name)}</td>
      <td>${esc(p.format_label || "未记录")}</td>
      <td class="n">${cell(p.sft_train)} / ${cell(p.sft_eval)}</td>
      <td class="n">${cell(p.dpo_train)} / ${cell(p.dpo_eval)}</td>
      <td class="n">${mb}</td>
      <td class="muted">${esc(stamp(p.generated_at) || "")}</td>
      <td><button class="slim" type="button" onclick="downloadZip('${esc(p.name)}')">下载</button></td>
    </tr>`;
  }).join("") || emptyRow(7, "还没有打包记录");
  return `<div class="pack-hist">
    <p class="faint" style="margin:0 0 10px;font-size:12px">共 ${fmt(packs.length)} 份，可下载任意一次生成结果。</p>
    <div class="scroll" style="max-height:320px"><table><thead><tr>
      <th>文件</th><th>格式</th><th class="n">SFT 训练 / 验证</th><th class="n">DPO 训练 / 验证</th><th class="n">体积</th><th>时间</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function renderRunsView(rb) {
  STATE.runbook = rb;
  STATE.delivery = rb.deliverable || {};
  $("#view-runs").innerHTML = rwRenderDeliveryDetail(rb);
}

async function loadRuns() {
  const seq = ++RUNS_REQUEST_SEQ;
  try {
    const [rb, packs] = await Promise.all([api("/api/runbook"), api("/api/export/history")]);
    if (seq !== RUNS_REQUEST_SEQ) return;
    STATE.packHist = packs || {packs:[]};
    renderRunsView(rb);
  } catch (e) {
    if (seq !== RUNS_REQUEST_SEQ) return;
    $("#view-runs").innerHTML = `<div class="panel"><div class="empty">${esc(e.message)}</div></div>`;
  }
}

function stopPackTimer() {
  if (PACK.timer) { clearInterval(PACK.timer); PACK.timer = null; }
}
function startPackTimer() {
  stopPackTimer();
  PACK.elapsed = 0;
  PACK.timer = setInterval(() => {
    if (!PACK.running || !PACK.startedAt) return;
    PACK.elapsed = Math.max(0, Math.floor((Date.now() - PACK.startedAt) / 1000));
    const el = document.getElementById("packElapsed");
    if (el) el.innerHTML = `已用时 <b>${PACK.elapsed}</b> 秒 · 请勿重复点击`;
    if (JOB_META && JOB_META.stage === "package" && JOB_LINES.length) {
      const last = JOB_LINES[JOB_LINES.length - 1] || "";
      const m = last.replace(/^\d{2}:\d{2}:\d{2}\s*/, "");
      if (m && m !== PACK.phase) {
        PACK.phase = m;
        const ph = document.getElementById("packPhase");
        if (ph) ph.textContent = m;
      }
    }
  }, 500);
}
function setPackButtonsDisabled(disabled) {
  document.querySelectorAll("button").forEach(btn => {
    const oc = btn.getAttribute("onclick") || "";
    if (/exportPackage\(|downloadZip\(/.test(oc) || /runStage\('all'/.test(oc)) {
      btn.disabled = !!disabled;
      if (/exportPackage\(/.test(oc) && disabled) btn.textContent = "打包中…";
    }
  });
}
async function exportPackage() {
  if (PACK.running) return;
  PACK.running = true;
  PACK.jobId = null;
  PACK.startedAt = Date.now();
  PACK.elapsed = 0;
  PACK.phase = "正在重新打包，约需 15–30 秒…";
  PACK.error = null;
  PACK.result = null;
  setPackButtonsDisabled(true);
  startPackTimer();
  if (STATE.tab === "runs") loadRuns().catch(() => {});
  try {
    const profile = currentExportProfile(STATE.runbook || {});
    const { job_id } = await api("/api/export/package", { method: "POST", body: JSON.stringify({ profile }) });
    PACK.jobId = job_id;
    toast("已提交打包，可在任务中心查看进度", "ok");
    watchJob(job_id, (j) => {
      stopPackTimer();
      PACK.running = false;
      PACK.elapsed = Math.max(
        PACK.elapsed,
        PACK.startedAt ? Math.floor((Date.now() - PACK.startedAt) / 1000) : PACK.elapsed
      );
      if (j.status === "done") {
        PACK.result = j.result || null;
        PACK.error = null;
      } else {
        PACK.error = j.error || "打包失败";
        PACK.result = null;
      }
      setPackButtonsDisabled(false);
      if (STATE.tab === "runs") loadRuns();
    });
  } catch (e) {
    stopPackTimer();
    PACK.running = false;
    PACK.error = e.message || String(e);
    PACK.result = null;
    setPackButtonsDisabled(false);
    toast(PACK.error, "err");
    if (STATE.tab === "runs") loadRuns();
  }
}

function downloadZip(name) {
  const q = new URLSearchParams({ t: String(Date.now()) });
  const picked = name || window.__lastZipName || "";
  if (picked) q.set("name", picked);
  window.location.href = "/api/export/download?" + q.toString();
}

async function openHandoff() {
  try {
    const d = await api("/api/train/handoff");
    openDrawer("handoff.md", "从环境搭建到训练的全流程");
    $("#drawerBody").innerHTML = `<div class="panel"><div class="panel-b"><div class="md">${md(d.markdown || "")}</div></div></div>`;
    setDrawerFoot(`<button onclick="showJson(${esc(JSON.stringify({ path: d.path }))})">路径</button>
      <span class="faint" style="font-size:12px;margin-left:8px">${esc(d.path || "")}</span>`);
  } catch (e) { toast(e.message, "err"); }
}

async function runStage(stage, force) {
  try {
    const {job_id} = await api("/api/run", {method:"POST", body: JSON.stringify({stage, force})});
    toast(`已启动 ${stage}${force ? "（全量重建）" : ""}`, "ok");
    toast("已提交，可在任务中心查看进度", "ok");
    watchJob(job_id);
  } catch (e) { toast(e.message, "err"); }
}

let JOB_TIMER = null, JOB_ID = null, JOB_LINES = [], JOB_META = null;
function paintJob() {
  const el = $("#jobConsole"); if (!el) return;
  const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
  el.innerHTML = JOB_LINES.length ? "" : `<span class="faint">启动任意阶段后，日志会实时出现在这里。</span>`;
  for (const line of JOB_LINES) {
    const d = document.createElement("div");
    d.textContent = line;
    if (/失败|error|Traceback/i.test(line)) d.className = "err";
    else if (/完成/.test(line)) d.className = "ok";
    el.appendChild(d);
  }
  if (atBottom) el.scrollTop = el.scrollHeight;
  const st = JOB_META;
  const stEl = $("#jobStatus");
  if (stEl && st) stEl.innerHTML = `${runTag(st.status)} <span class="mono faint" style="margin-left:8px">${esc(st.stage)}${st.force?"，全量":""}，作业 ${esc(st.id)}</span>`;
}
function watchJob(jobId, onDone) {
  registerJobWatch(jobId, onDone);
  if (JOB_TIMER) clearInterval(JOB_TIMER);
  if (RB_TIMER) clearInterval(RB_TIMER);
  JOB_ID = jobId; JOB_LINES = []; JOB_META = null;
  let offset = 0, rbTick = 0;
  const tick = async () => {
    try {
      const j = await api(`/api/jobs/${jobId}?offset=${offset}`);
      if (offset === 0) JOB_LINES = [];
      JOB_LINES.push(...(j.logs||[]));
      offset += (j.logs||[]).length;
      JOB_META = j;
      if (STATE.tab === "runs") paintJob();
      if (RAW_DRAWER.analyzeJobId === jobId) paintRawDrawerAnalyze();
      // 运行中每 2 秒刷新 runbook，使步骤状态与 @@STEP 上报同步
      if (STATE.tab === "runs" && ++rbTick % 2 === 0) {
        api("/api/runbook").then(rb => {
          if (STATE.tab === "runs" && JOB_ID === jobId)
            renderRunsView(rb);
        }).catch(() => {});
      }
      if (j.status !== "running") {
        clearInterval(JOB_TIMER); JOB_TIMER = null;
        if (RB_TIMER) { clearInterval(RB_TIMER); RB_TIMER = null; }
        onTaskFinished(j);
        if (STATE.tab === "runs" && j.stage !== "package") loadRuns();
      }
    } catch (e) { /* job may not be registered yet */ }
  };
  tick(); JOB_TIMER = setInterval(tick, 900);
}
let RB_TIMER = null;

/* ------------------------------ 抽屉 / 通用 ------------------------------ */
function setDrawerFoot(html, className="df") {
  const foot = $("#drawerFoot");
  foot.className = className;
  foot.innerHTML = html;
  foot.hidden = !html.trim();
}
function openDrawer(title, sub="") {
  DRAWER_REQUEST_SEQ += 1;
  $("#drawerTitle").textContent = title; $("#drawerSub").textContent = sub || "";
  setDrawerFoot("");
  $("#drawerBody").scrollTop = 0;
  $("#drawer").classList.add("open");
  $("#scrim").classList.add("open");
}
function closeDrawer() {
  if (REV.dirty) revFlush();
  REV.active = false;
  stopRawAnalyzeTimer();
  $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); STATE.drawerData = null;
}
function showJson(data) {
  const obj = typeof data === "string" ? (()=>{try{return JSON.parse(data)}catch{return data}})() : data;
  openDrawer("JSON", "");
  $("#drawerBody").innerHTML = `<div class="panel"><div class="panel-b"><pre class="json">${esc(typeof obj === "string" ? obj : JSON.stringify(obj, null, 2))}</pre></div></div>`;
}
document.addEventListener("keydown", e => {
  const typing = e.target && (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable);
  if (e.key === "Escape") {
    if (e.target && e.target.id === "flowQ" && e.target.value) { e.target.value = ""; flowSearch(""); return; }
    closeDrawer();
    return;
  }
});
window.addEventListener("hashchange", () => {
  const tab = location.hash.slice(1);
  if (tab && tab !== STATE.tab) setTab(tab);
});

$("#btnRunAll").onclick = () => runStage("all", false);
$("#drawerFoot").addEventListener("click", onDrawerFootClick);
taskHubEnsure();
setTab(location.hash.slice(1) || "overview");
if (STATE.tab !== "overview") refreshMeta().catch(() => {});
</script>
