  .ds-group-h{padding:7px 8px 6px;font-size:11px;letter-spacing:.02em;border-bottom:1px solid var(--line-soft);margin-bottom:4px}
  .ds-row{padding:9px 8px;border-radius:7px;gap:8px}
  .ds-row .ds-file{font-size:11.5px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ds-row .ds-from{font-size:10.5px;line-height:1.4;margin-top:2px}
  .ds-row .ds-num{font-size:12px}
  .train-main{position:relative}
  .train-now{padding:16px 18px 0;gap:10px;align-items:center}
  .train-now b{font-size:13px;white-space:normal;overflow-wrap:anywhere}
  .train-from{padding:5px 18px 13px;font-size:11.5px;max-width:100ch;border-bottom:1px solid var(--line-soft)}
  .train-main .toolbar{padding:10px 14px}
  .train-main .toolbar input[type=text]{min-width:150px}
  .train-main .toolbar select{max-width:160px}
  .train-main .scroll{max-height:none}
  .train-main td{font-size:12px;vertical-align:top}
  .train-main .clip{max-width:360px}
  /* 训练数据层级树：分组 → 黄金会话 → 轨迹 → SFT/DPO 节点 → 切片，停用与切分向下继承 */
  .train-tree-shell{display:flex;flex-direction:column;gap:14px}
  .tree-node{border:1px solid var(--line-soft);border-radius:10px;background:var(--ink-1);overflow:hidden}
  .tree-node.off{opacity:.62}
  .tree-head{display:flex;gap:10px;align-items:center;padding:11px 14px;flex-wrap:wrap}
  .tree-head .tree-title{font-weight:600;font-size:13.5px}
  .tree-children{padding:2px 14px 12px 30px}
  .tree-session{border-top:1px solid var(--line-soft);padding:9px 0}
  .tree-session-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tree-trajectory{border-top:1px dashed var(--line-soft);padding:8px 0 4px}
  .tree-trajectory:first-child{border-top:none}
  .tree-trajectory-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:4px 0}
  .tree-trajectory-head.clickable{cursor:pointer;border-radius:6px;padding:4px 8px;margin:0 -8px}
  .tree-trajectory-head.clickable:hover{background:rgba(255,255,255,.03)}
  .tree-trajectory.off > .tree-trajectory-head{opacity:.55}
  .tree-kinds{padding:4px 0 2px 28px}
  .tree-kind{padding:4px 0}
  .tree-kind-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:3px 0}
  .tree-samples{padding:6px 0 4px 30px}
  .tree-sample{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;min-width:0}
  .tree-sample:hover{background:rgba(255,255,255,.03)}
  .tree-sample.off{opacity:.88}
  .tree-sample-label{flex:none;font-size:13px;color:var(--text);font-weight:500;white-space:nowrap}
  .tree-sample-meta{flex:1 1 auto;min-width:0;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tree-sample-meta .bad{color:#e9a497}
  .tree-sample-meta .good{color:#cbe4c2}
  .tree-sample-status{flex:none;font-size:12px;color:var(--amber);white-space:nowrap;max-width:28%;overflow:hidden;text-overflow:ellipsis}
  .tree-action{flex:none;min-height:22px;height:22px;padding:0 9px;font-size:11px;font-weight:500;border-radius:999px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .tree-action.on{background:rgba(143,196,127,.14);border:1px solid rgba(143,196,127,.45);color:#cbe4c2}
  .tree-action.on:hover{background:rgba(143,196,127,.24);border-color:#8fc47f;color:#eaf6e4}
  .tree-action.off{background:rgba(255,255,255,.025);border:1px solid var(--line);color:var(--text-3)}
  .tree-action.off:hover{background:rgba(227,115,95,.14);border-color:rgba(227,115,95,.55);color:#f0a091}
  .tree-toggle{flex:none;width:26px;min-height:26px;padding:0;font-family:var(--f-mono)}
  .tree-counts{font-size:12px;color:var(--text-2)}
  .tree-layer-note{font-size:11.5px;color:var(--amber)}

  /* 任务：列表负责定位，详情负责解释与下一步 */
  .tasks-shell{grid-template-columns:330px minmax(0,1fr);gap:16px;min-height:560px;align-items:start}
  .tasks-list{border-color:var(--line-soft);border-radius:12px;max-height:calc(100vh - 204px);overflow:auto}
  .tasks-list-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:13px 16px;
    background:var(--ink-1);border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--text-2)}
  .tasks-list-head b{font-weight:500;color:var(--text)}
  .task-row{display:block;width:100%;min-height:0;border:0;border-bottom:1px solid var(--line-soft);border-radius:0;
    background:transparent;color:inherit;text-align:left;cursor:pointer;padding:14px 16px;position:relative}
  .task-row:hover{background:rgba(255,255,255,.025);border-color:var(--line-soft)}
  .task-row:last-child{border-bottom:none}
  .task-row.on{background:rgba(217,180,103,.065);border-left:2px solid var(--gold);padding-left:14px}
  .task-row .row{gap:8px;margin-bottom:5px!important}
  .task-row .task-title{display:block;font-size:13px;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
  .task-row .task-sub{display:block;font-size:11px;line-height:1.5;color:var(--text-3);margin-top:4px}
  .task-row .task-progress{display:block;height:3px;background:var(--ink-3);border-radius:3px;margin-top:10px;overflow:hidden}
  .task-row .task-progress i{display:block;height:100%;background:var(--mint)}
  .task-detail{border-color:var(--line-soft);border-radius:12px;min-height:560px;overflow:hidden}
  .task-detail-head{padding:20px 22px 16px;border-bottom:1px solid var(--line-soft)}
  .task-detail-head h2{font-size:17px;line-height:1.45;font-weight:600;margin:10px 0 5px;overflow-wrap:anywhere}
  .task-detail-head .task-subtitle{font-size:12px;color:var(--text-2);line-height:1.6}
  .task-detail-progress{margin-top:16px}
  .task-detail-progress .progress-label{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--text-2);margin-bottom:7px}
  .task-progress-track{height:5px;border-radius:5px;background:var(--ink-3);overflow:hidden}
  .task-progress-track i{display:block;height:100%;background:var(--mint);transition:width .3s ease}
  .task-detail-error{margin:14px 0 0;padding:10px 12px;border:1px solid rgba(227,115,95,.35);border-radius:8px;
    background:rgba(227,115,95,.07);color:#efb2a6;font-size:12px;line-height:1.6}
  .task-detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .task-log-head{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--text-2)}
  .task-log-head .grow{flex:1}
  .task-log{max-height:calc(100vh - 440px);min-height:240px;padding:14px 18px;background:#111419;line-height:1.7;font-size:11.5px}
  .task-log div{padding:2px 0}
  .task-log .ts{display:inline-block;min-width:5.2em;margin-right:8px;color:var(--text-3);
    font:10.5px/1.7 var(--f-mono);font-variant-numeric:tabular-nums}

  /* 配置与交付：保留工具属性，降低装饰与重复文案 */
  .cfg-shell{grid-template-columns:200px minmax(0,1fr);height:calc(100vh - 166px);min-height:560px}
  .cfg-rail{background:var(--ink-1);padding:16px 0}
  .cfg-rail-h{padding:0 18px 10px;letter-spacing:0;text-transform:none;font-size:11.5px}
  .cfg-nav{padding:10px 18px;font-size:12.5px;border-left-width:2px;border-radius:0;min-height:38px}
  .cfg-nav:hover{background:rgba(255,255,255,.025)}
  .cfg-nav.on{background:rgba(217,180,103,.08);border-left-color:var(--gold);color:var(--gold)}
  .cfg-bar{padding:14px 20px;min-height:68px}
  .cfg-bar h2{font-size:15px}
  .cfg-scroll{padding:0 22px 92px}
  .cfg-sec{padding-top:24px;max-width:1100px}
  .cfg-sec-h{padding-bottom:12px;align-items:baseline}
  .cfg-sec-h h3{font-size:14px}
  .cfg-row{padding:16px 2px;gap:28px}
  .cfg-row .nm{font-size:12.5px}
  .cfg-row .hint{font-size:11.5px;max-width:66ch}
  .cfg-row .mono-hint{font-size:10px;margin-top:4px;color:var(--text-3)}
  .cfg-ctl{gap:10px}
  .cfg-savebar{padding:12px 20px}
  .rw-head{padding:16px 18px;margin-bottom:18px;gap:16px}
  .rw-head-stat b{font-size:25px;font-weight:400}
  .rw-head-next{font-size:12px;line-height:1.6}
  .rw-head-acts{gap:8px}
  .rw-shell{grid-template-columns:270px minmax(0,1fr);gap:16px}
  .rw-node{padding:14px 12px;border-radius:10px}
  .rw-node.sel{background:rgba(217,180,103,.07);border-color:rgba(217,180,103,.65)}
  .rw-stage-h{padding:18px 20px}
  .rw-stage-h h2{font-size:16px}
  .rw-stage-h p{max-width:70ch;line-height:1.6}
  .rw-step-row{padding:13px 20px}
  .rw-step-detail{padding:0 20px 16px 52px}
  .rw-pack{padding:20px;gap:14px}
  .rw-pack-card{padding:16px 18px}
  .fmt-pick{gap:12px}
  button.fmt-opt{padding:16px;min-height:0}
  button.fmt-opt.on{background:rgba(217,180,103,.08)}
  .pack-hist{margin-top:4px}
  .pack-hist h3{font-size:13px}
  .rb-fold>summary{padding:12px 16px}
  .console{font-size:11.5px}

  @media (max-width:1200px){
    :root{--page-gutter:24px}
    .tasks-shell{grid-template-columns:290px minmax(0,1fr)}
    .train-shell{grid-template-columns:260px minmax(0,1fr)}
    .rw-shell{grid-template-columns:240px minmax(0,1fr)}
    .rw-head{flex-wrap:wrap}
    .rw-head-next{border-left:none;padding-left:0;flex-basis:100%;order:3}
    .rw-head-acts{margin-left:auto}
  }
  @media (max-width:900px){
    .metric-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
    .tasks-shell,.rw-shell{grid-template-columns:1fr}
    .tasks-list{max-height:300px}
    .task-detail{min-height:420px}
    .task-log{max-height:360px}
    .collect-shell{grid-template-columns:280px minmax(0,1fr)}
    .rw-head-acts{margin-left:0}
    .fmt-pick{grid-template-columns:1fr}
  }
  @media (max-width:860px){
    :root{--page-gutter:16px}
    main{padding-bottom:40px}
    .page-head{padding-top:20px}
    .page-head h1{font-size:20px}
    .page-head p{font-size:12px}
    .toolbar{align-items:stretch}
    .toolbar .grow{display:none}
    .toolbar input[type=text],.toolbar input[type=search],.filter-search{max-width:none;flex-basis:100%;min-width:0}
    .toolbar .count{white-space:normal}
    .scroll{max-height:none;overflow:auto}
    th,td{white-space:normal}
    th{white-space:nowrap}
    .metric-strip{margin-bottom:12px}
    .metric-strip .metric{padding:12px}
    .metric .metric-value{font-size:23px}
    .collect-shell,.train-shell,.cfg-shell{grid-template-columns:1fr;height:auto;min-height:0}
    .collect-side{max-height:320px;border-right:none;border-bottom:1px solid var(--line-soft)}
    .collect-main{min-height:420px}
    .collect-actions .grow{display:none}
    .train-rail{max-height:290px;border-right:none;border-bottom:1px solid var(--line-soft)}
    .train-main .scroll{max-height:none}
    .train-main .toolbar .grow{display:none}
    .train-now{padding:14px 14px 0}
    .train-from{padding:5px 14px 12px}
    .cfg-main{overflow:visible}
    .cfg-rail{padding:6px;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line-soft)}
    .cfg-nav{width:auto;white-space:nowrap;border-left:none;border-bottom:2px solid transparent;min-height:36px;padding:8px 12px}
    .cfg-nav.on{border-left:none;border-bottom-color:var(--gold)}
    .cfg-scroll{overflow:visible;padding:0 16px 24px}
    .cfg-savebar{position:sticky;bottom:0}
    .cfg-row{grid-template-columns:1fr;gap:12px}
    .cfg-ctl{justify-content:flex-start}
    .cfg-tags{justify-content:flex-start}
    .tasks-list{max-height:280px}
    .task-detail-head{padding:16px}
    .rw-head{padding:14px;gap:12px}
    .rw-head-stat b{font-size:23px}
    .rw-stage-h{padding:16px}
    .rw-stage-acts{margin-left:0;flex-wrap:wrap}
    .rw-step-row{grid-template-columns:22px minmax(0,1fr) auto 16px;padding:12px 14px}
    .rw-step-row>.row{grid-column:2 / -1;justify-content:flex-start}
    .rw-step-detail{padding:0 14px 14px 46px}
    .rw-pack{padding:14px}
    .rw-pack-grid{grid-template-columns:1fr 1fr}
  }
  @media (max-width:560px){
    .metric-strip{grid-template-columns:1fr 1fr}
    .metric .metric-note{font-size:10px}
    .toolbar .seg-ctl{max-width:100%;overflow-x:auto}
    .toolbar button{white-space:nowrap}
    .task-detail-head h2{font-size:15px}
    .rw-pack-grid{grid-template-columns:1fr}
    .rw-head-acts button{flex:1 1 auto}
    .cfg-bar{padding:12px 14px}
    .cfg-bar .grow{display:none}
    .cfg-search{width:100%;order:3}
  }
  /* ---------- 抽屉内容视图与轻量操作栏 ---------- */
  .drawer .df[hidden]{display:none!important}
  .drawer .df.session-drawer-foot{display:block;height:auto;max-height:none;overflow:visible;padding:0;
    background:var(--ink-1);border-top:1px solid var(--line)}
  .session-foot{display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 16px}
  .session-role-control{display:flex;align-items:center;gap:9px;min-width:0}
  .session-foot-label{font-size:11.5px;color:var(--text-3);white-space:nowrap}
  .session-role-switch{width:auto;min-width:218px;padding:2px}
  .session-role-switch button{min-height:30px;padding:4px 10px;font-size:12px}
  .session-role-control .foot-status{max-width:210px;font-size:10.5px}
  .session-actions{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-wrap:wrap;min-width:0}
  .session-actions button{white-space:nowrap}
  button.session-delete-btn{min-height:28px;padding:4px 7px;margin-left:4px;border:none;border-left:1px solid var(--line);
    border-radius:0;background:transparent;color:#d89587;font-size:11.5px}
  button.session-delete-btn:hover{background:rgba(227,115,95,.07);color:#f0a091;border-color:var(--line)}
  .session-job-status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-2);white-space:nowrap}
  .session-job-track{width:88px;height:4px;border-radius:4px;background:var(--ink-3);overflow:hidden}
  .session-job-track i{display:block;height:100%;background:var(--mint)}
  .session-job-ok{font-size:11.5px;color:var(--pos)}
  .session-job-error{font-size:11.5px;color:var(--neg)}

  .gold-view-nav{position:sticky;top:-18px;z-index:8;display:flex;align-items:flex-end;gap:26px;
    margin:-2px 0 16px;padding:0 4px;background:var(--ink-1);border-bottom:1px solid var(--line)}
  .gold-view-tab{display:flex;align-items:baseline;gap:7px;min-height:47px;padding:10px 2px 11px;
    background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--text-2);font-size:13px}
  .gold-view-tab:hover{background:transparent;color:var(--text);border-bottom-color:var(--line)}
  .gold-view-tab.on{color:var(--text);border-bottom-color:var(--gold)}
  .gold-view-tab .num{font-size:15px;color:var(--text);font-weight:500}
  .gold-view-tab small{font-size:10.5px;color:var(--text-3)}
  .gold-view-tab[data-gold-view="sft"].on{border-bottom-color:var(--mint)}
  .gold-view-tab[data-gold-view="dpo"].on{border-bottom-color:var(--ore)}
  .gold-summary-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;
    color:var(--text-3);font-size:11.5px;line-height:1.6}
  .gold-summary-line b{font-family:var(--f-num);font-weight:500;color:var(--text-2)}
  .gold-quality>summary,.gold-gate>summary{list-style:none;cursor:pointer;user-select:none}
  .gold-quality>summary::-webkit-details-marker,.gold-gate>summary::-webkit-details-marker{display:none}
  .gold-quality>summary::before,.gold-gate>summary::before{content:"";width:0;height:0;border-left:5px solid var(--text-3);
    border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s;flex:none}
  .gold-quality[open]>summary::before,.gold-gate[open]>summary::before{transform:rotate(90deg)}
  .gold-quality .quality-body{font-size:12.5px;line-height:1.7}

  .gold-dataset{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 196px);min-height:480px;
    border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;background:var(--ink-0)}
  .gold-sample-list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line-soft);background:var(--ink-1)}
  .gold-sample-item-wrap{position:relative;padding:0;border-bottom:1px solid var(--line-soft);transition:background-color .14s ease}
  .gold-sample-item-wrap:hover{background:rgba(255,255,255,.025)}
  .gold-sample-item-wrap.on{background:rgba(95,185,196,.07);box-shadow:inset 2px 0 var(--mint)}
  .gold-sample-item-wrap.off .gold-sample-item{opacity:.58}
  .gold-sample-item-wrap .sample-toggle-slot{position:absolute;top:10px;right:12px;z-index:2;display:flex;align-items:center}
  .gold-sample-item-wrap:not(.off):not(:hover) .sample-toggle-slot .toggle-pill{opacity:.68}
  .gold-sample-list-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line-soft);
    font-size:11.5px;color:var(--text-3);flex-wrap:wrap}
  .gold-sample-list-h b{font-size:12.5px;font-weight:600;color:var(--text)}
  .gold-sample-list-h .grow{flex:1}
  .gold-sample-scroll{overflow:auto;min-height:0;flex:1}
  .gold-sample-item{display:block;width:100%;min-height:0;padding:10px 12px;text-align:left;background:transparent;
    border:none;border-radius:0;color:var(--text-2);cursor:pointer}
  .gold-sample-item:hover{background:transparent}

  .gold-dataset-empty{display:flex;align-items:center;justify-content:center;min-height:260px;padding:32px;text-align:center;color:var(--text-3)}
  .gold-dataset-empty h3{margin:0 0 6px;font-size:14px;color:var(--text-2)}
  .gold-dataset-empty p{margin:0 0 14px;font-size:12px;line-height:1.65}

  @media (max-width:900px){

  /* ---------- 交付：历史包列表为主 ---------- */
  .delivery-workspace{display:flex;flex-direction:column;gap:16px;margin-bottom:18px}
  .delivery-new-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px}

  .delivery-pack-list{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px}
  .delivery-pack-card{
    display:grid;grid-template-columns:minmax(10rem,.75fr) minmax(0,1.7fr) auto;
    grid-template-areas:"info len actions";gap:8px 14px;align-items:center;
    padding:10px 12px;border:1px solid var(--line-soft);border-radius:8px;background:rgba(255,255,255,.02)}
  .delivery-pack-card .pack-info{grid-area:info;min-width:0}
  .delivery-pack-card .pack-name{font-size:12.5px;font-weight:600;overflow-wrap:anywhere;line-height:1.35}
  .delivery-pack-card .pack-meta{margin-top:2px;font-size:11px;color:var(--text-3);line-height:1.4}
  .delivery-pack-card .pack-counts{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px}
  .delivery-pack-card .pack-counts .chip-n{
    display:inline-flex;align-items:baseline;gap:3px;padding:1px 6px;border-radius:999px;
    background:rgba(255,255,255,.04);border:1px solid var(--line-soft);font-size:10.5px;color:var(--text-3)}
  .delivery-pack-card .pack-counts .chip-n b{font:600 11px/1 var(--f-num);color:var(--text-2)}
  .delivery-pack-actions{grid-area:actions;display:flex;flex-direction:column;align-items:stretch;gap:5px}
  .delivery-pack-actions select{min-width:8.5rem;max-width:12rem;padding:4px 26px 4px 8px;font-size:12px}
  .delivery-pack-actions button.slim{padding:3px 8px}
  .delivery-pack-card .pack-len{grid-area:len;min-width:0;display:flex;justify-content:flex-start}
  .pack-len-chart{
    position:relative;display:grid;gap:2px;padding:5px 7px 4px;border-radius:7px;width:100%;max-width:320px;

    display:flex;align-items:center;gap:10px;font:9px/1 var(--f-num);color:var(--text-3)}

  .pack-len-legend .sft i{background:#7ecad3}
  .pack-len-legend .dpo i{background:#b7c0ef}
  .pack-len-plot{
    position:relative;height:72px;border-bottom:1px solid rgba(255,255,255,.06);overflow:hidden}
  .pack-len-plot svg{display:block;width:100%;height:100%}
  .pack-len-plot .grid-v{stroke:rgba(255,255,255,.07);stroke-width:1;vector-effect:non-scaling-stroke}
  .pack-len-plot .grid-cut{stroke:rgba(217,180,103,.65);stroke-width:1;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
  .pack-len-plot .line-sft{fill:none;stroke:#7ecad3;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .pack-len-plot .line-dpo{fill:none;stroke:#b7c0ef;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .pack-len-plot .area-sft{fill:rgba(95,185,196,.12);stroke:none}
  .pack-len-plot .area-dpo{fill:rgba(169,178,220,.12);stroke:none}
  .pack-len-ruler{
    position:relative;height:12px;margin-top:1px;font:8.5px/1 var(--f-num);color:var(--text-3);
    font-variant-numeric:tabular-nums}
  .pack-len-ruler>span{
    position:absolute;top:3px;left:calc(var(--i) / var(--n) * 100%);transform:translateX(-50%);
    white-space:nowrap}
  .pack-len-ruler>span::before{
    content:"";position:absolute;left:50%;top:-4px;width:1px;height:3px;background:rgba(255,255,255,.18);
    transform:translateX(-50%)}
  .pack-len-ruler>span.start{transform:none;left:0}
  .pack-len-ruler>span.start::before{left:0;transform:none}
  .pack-len-ruler>span.end{left:100%;transform:translateX(-100%)}
  .pack-len-ruler>span.end::before{left:auto;right:0;transform:none}
  .pack-len-ruler>span.cut{color:var(--gold);font-weight:600}
  .pack-len-ruler>span.cut::before{background:rgba(217,180,103,.7);height:4px;top:-5px}
  .pack-len-empty{
    display:grid;place-items:center;min-height:72px;width:100%;max-width:320px;border-radius:7px;

  .delivery-len-grid{display:grid;gap:14px}

  /* ---------- Phase 3：评估报告、操作审计账本、三态血缘与包间对比 ---------- */
  .snapshot-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:18px}
  .snap-card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008));border:1px solid var(--line);

  .report-list,.ledger-feed{display:flex;flex-direction:column}
  .report-item,.ledger-item{padding:13px 18px;border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:6px;
    transition:background .15s}
  .report-item:last-child,.ledger-item:last-child{border-bottom:none}
  .report-item.clickable,.ledger-item.clickable{cursor:pointer}
  .report-item.clickable:hover,.ledger-item.clickable:hover{background:rgba(255,255,255,.025)}
  .report-title{font-size:14px;font-weight:600;color:var(--text)}
  .report-sub,.ledger-reason{font-size:12.5px;color:var(--text-2);line-height:1.55}
  .actor-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 8px;border-radius:999px;font-family:var(--f-mono)}
  .actor-chip.agent{color:var(--gold);background:rgba(217,180,103,.12);border:1px solid rgba(217,180,103,.32)}
  .actor-chip.human{color:var(--mint);background:rgba(95,185,196,.12);border:1px solid rgba(95,185,196,.32)}
  .tool-badge{font-family:var(--f-mono);font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--ink-2);
    border:1px solid var(--line);color:var(--text)}
  .hub-mode-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .lineage-step{border:1px solid var(--line-soft);border-radius:9px;margin-bottom:8px;background:var(--ink-0);overflow:hidden}
  .lineage-step summary{list-style:none;cursor:pointer;padding:9px 13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
  .lineage-step summary::-webkit-details-marker{display:none}
  .lineage-step summary:hover{background:rgba(255,255,255,.02)}
  .lineage-step-body{padding:10px 13px 13px;border-top:1px solid var(--line-soft);background:var(--ink-1)}
  .ls-state{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:500;white-space:nowrap}
  .ls-kept{color:var(--pos);background:rgba(143,196,127,.12);border:1px solid rgba(143,196,127,.28)}
  .ls-rewritten{color:var(--gold);background:rgba(217,180,103,.14);border:1px solid rgba(217,180,103,.32)}
  .ls-pruned{color:var(--neg);background:rgba(227,115,95,.12);border:1px solid rgba(227,115,95,.3)}
  .ls-folded{color:var(--mint);background:rgba(95,185,196,.12);border:1px solid rgba(95,185,196,.3)}
  .ls-excluded{color:#f0a091;background:rgba(227,115,95,.18);border:1px solid var(--neg)}
  .gate-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;margin-bottom:14px;border:1px solid var(--line)}
  .gate-banner.pass{background:rgba(143,196,127,.09);border-color:rgba(143,196,127,.35)}
  .gate-banner.fail{background:rgba(227,115,95,.1);border-color:rgba(227,115,95,.4)}
  .gate-checks{display:grid;gap:8px;margin-top:10px}
  .gate-check-row{display:flex;align-items:baseline;gap:10px;padding:8px 12px;border-radius:8px;background:var(--ink-0);border:1px solid var(--line-soft);font-size:12.5px}
  .diff-delta-pos{color:var(--pos);font-weight:600}
  .diff-delta-neg{color:var(--neg);font-weight:600}

  /* ---------- Variant A：虚拟数据集条目、演进 DAG 画布与 CAS 四层钻取 ---------- */
  .dag-canvas{
    padding:20px 18px;overflow-x:auto;
    background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.045) 1px,transparent 0);
    background-size:20px 20px;
  }
  .dag-track{display:flex;align-items:flex-start;gap:12px;min-width:max-content}
  .dag-col{display:flex;flex-direction:column;gap:12px}
  .vds-node{
    width:246px;padding:13px 15px;border-radius:11px;cursor:pointer;
    background:var(--ink-1);border:1.5px solid var(--line);
    transition:transform .12s,border-color .15s,box-shadow .15s,background .15s;
  }
  .vds-node:hover{border-color:#525f77;transform:translateY(-1px)}
  .vds-node.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,180,103,.16);background:#202632}
  .vds-node.is-draft{
    border-style:dashed;border-color:var(--gold);
    background:repeating-linear-gradient(-45deg,rgba(217,180,103,.04),rgba(217,180,103,.04) 8px,rgba(28,32,40,.92) 8px,rgba(28,32,40,.92) 16px);
  }
  .vds-title{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;margin-top:6px}
  .vds-metrics{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--text-2)}
  .vds-metrics b{color:var(--text);font-family:var(--f-num)}
  .vds-edge{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:194px;padding-top:24px;position:relative}
  .vds-edge-line{width:100%;height:2px;background:var(--line);position:relative}
  .vds-edge-line.dashed{background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px)}
  .vds-edge-line::after{content:"▸";position:absolute;right:-4px;top:-11px;color:var(--gold);font-size:14px}
  .vds-edge-card{
    margin-top:-15px;z-index:2;padding:8px 11px;border-radius:9px;cursor:pointer;
    background:var(--ink-2);border:1px solid var(--line);width:184px;font-size:11.5px;
    transition:border-color .15s,background .15s,box-shadow .15s;
  }
  .vds-edge-card:hover{border-color:var(--mint);background:var(--ink-3)}
  .vds-edge-card.selected{border-color:var(--mint);box-shadow:0 0 0 3px rgba(95,185,196,.18)}
  .vds-subtabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line-soft);background:rgba(0,0,0,.14);flex-wrap:wrap}
  .vds-subtabs button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:11px 14px;color:var(--text-2);font-weight:500}
  .vds-subtabs button:hover{color:var(--text);background:transparent}
  .vds-subtabs button.active{color:var(--gold);border-bottom-color:var(--gold)}
  .vds-subtabs .cnt{font-family:var(--f-num);font-size:12px;color:var(--text-3);margin-left:5px}
  .cas-chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:999px;color:var(--mint);background:rgba(95,185,196,.09);border:1px solid rgba(95,185,196,.32);white-space:nowrap}
  .vds-kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
  .vds-kpi{padding:13px 15px;border-radius:10px;background:var(--ink-0);border:1px solid var(--line-soft)}
  .vds-kpi .k{font-size:12px;color:var(--text-3)}
  .vds-kpi .v{font-size:20px;font-weight:700;font-family:var(--f-num);margin-top:3px}
  .vds-kpi .s{font-size:11.5px;color:var(--text-2);margin-top:3px}
  @media (max-width:960px){.vds-kpi-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const jsArg = s => esc(JSON.stringify(String(s ?? "")));
const fmt = n => (n === undefined || n === null) ? "–" : Number(n).toLocaleString();
const short = (s, n=80) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n) + "…" : s; };
const sum = o => Object.values(o || {}).reduce((a, b) => a + (+b || 0), 0);

const COLORS = {ore:"#8d9ab2", gold:"#d9b467", mint:"#5fb9c4", pos:"#8fc47f", neg:"#e3735f", pend:"#a9b2dc"};

const VERDICT_ZH = {gold:"入选黄金", reject:"剔除", revise:"需修订", maybe:"存疑", needs_review:"待人工复核"};
const SCRIPT_ZH = {gold:"黄金", negative_source:"DPO 来源素材", raw_only:"仅保留原始", needs_review:"待复核", discard_recommended:"不建议训练", rejected:"步数不足"};
const RUN_ZH = {done:"完成", failed:"失败", running:"运行中", queued:"排队中", stale:"已中断"};
const JOB_ACTIVE = st => st === "running" || st === "queued";
const PATHO_ZH = {
  missing_thinking_block:"缺失思考块", tool_execution_error:"工具执行报错", over_rumination_length:"思考过长",
  over_rumination_doubt_loop:"反复自我怀疑", mental_hex_checkmark:"心算十六进制自证", tool_logical_failure:"工具逻辑失败",
  cross_dir_violation:"跨目录越界", hallucinated_source_search:"臆造源码搜索",
};
const PHASE = [["highlight","高光","#d9b467"],["opening","开局","#8d9ab2"],["key_decision","关键决策","#c9a46a"],["routine","常规推进","#5fb9c4"],["closing","收尾","#a9b2dc"]];
const DPO_SRC_ZH = {stage2_pruned:"弯路", negative_step:"坏步", review_rewrite:"改写", meowdoku_dpo_chain:"链缺陷"};
const DPO_GATE_ZH = {good:"通过", swap:"对调后纳入", drop:"丢弃", pending:"待复核", review_failed:"复核失败", bypassed:"已跳过", passed:"通过", invalid:"内容无效"};
const SKIP_ZH = {non_crack_folder:"非目标目录", excluded_folder:"排除目录", empty:"空会话"};
const PAGES = {

function updateTasksBadge() {

  } else {

  }

function onTaskFinished(t) {
  if (!t || !t.id || TASK_HUB.notified.has(t.id)) return;
  TASK_HUB.notified.add(t.id);
  const cb = TASK_HUB.watched.get(t.id);
  if (cb && cb.onDone) try { cb.onDone(t); } catch (_) {}
  TASK_HUB.watched.delete(t.id);
  refreshMeta().catch(() => {});
  if (STATE.tab === "overview") loadOverview().catch(() => {});
  if (t.status === "done" && t.stage !== "package") {
    STATE.poured = true;
    toast(`${t.title || t.stage} 已完成`, "ok");
  }
  else if (t.status === "failed") toast(`${t.title || t.stage} 失败：${t.error || ""}`, "err");
  else if (t.status === "stale") toast(`${t.title || t.stage} 已中断`, "err");
}

async function taskHubPoll() {
  try {
    const prevActive = new Set(TASK_HUB.tasks.filter(x => JOB_ACTIVE(x.status)).map(x => x.id));
    const d = await api("/api/tasks");
    TASK_HUB.tasks = d.tasks || [];
    TASK_HUB.running = d.running || 0;
    TASK_HUB.queued = d.queued || 0;
    updateTasksBadge();
    paintOverviewTaskStrip();
    if (STATE.tab === "tasks") {
      refreshTasksListStatusChips();
      refreshTaskDetailChrome();
    }
    for (const t of TASK_HUB.tasks) {
      if ((t.status === "done" || t.status === "failed" || t.status === "stale") && prevActive.has(t.id)) {
        onTaskFinished(t);
      }
    }
    const polled = new Set();
    for (const t of TASK_HUB.tasks) {
      if (!JOB_ACTIVE(t.status)) continue;
      if (polled.has(t.id)) continue;
      if (STATE.tab === "tasks" && STATE.tasksSelectedId === t.id) {
        polled.add(t.id);
        pollTaskLogs(t.id);
      } else if (TASK_HUB.watched.has(t.id)) {
        polled.add(t.id);
      }
    }
  } catch (_) { /* ignore */ }
  clearTimeout(TASK_HUB.pollTimer);
  const busy = (TASK_HUB.running || 0) + (TASK_HUB.queued || 0) > 0;
  TASK_HUB.pollTimer = setTimeout(taskHubPoll, busy ? 1500 : 15000);
}

function taskHubEnsure() {
  if (!TASK_HUB.pollTimer) taskHubPoll();
}

function paintOverviewTaskStrip() {
  const host = $("#overviewTaskStrip");
  if (!host) return;
  const active = TASK_HUB.tasks.filter(t => JOB_ACTIVE(t.status)).slice(0, 3);
  if (!active.length) { host.innerHTML = ""; host.classList.add("hidden"); return; }
  host.classList.remove("hidden");
  host.innerHTML = `<div class="task-strip"><span class="faint" style="font-size:12px">进行中 / 排队</span>
    ${active.map(t => `<button type="button" class="chip" onclick="jumpToTasks('${esc(t.id)}')">${esc(t.title)}${t.status === "queued" ? "（排队）" : ""}</button>`).join("")}
    <button type="button" class="ghost" style="font-size:12px" onclick="jumpToTasks('')">查看全部 →</button></div>`;
}

function taskStatusTag(st) {
  const cls = st === "done" ? "train" : st === "failed" || st === "stale" ? "neg" : "";
  return `<span class="chip ${cls}">${esc(RUN_ZH[st] || st)}</span>`;

function taskOpenAction(t) {
  const st = taskEffectiveStatus(t);
  const sids = (t.links && t.links.sids) || (t.result && t.result.sessions) || (t.extra && t.extra.sessions) || [];
  const sid = Array.isArray(sids) ? sids[0] : null;
  const dis = st !== "done" ? " disabled" : "";
  const tip = st === "running" || st === "queued" ? " title=\"任务尚未完成，完成后可打开\"" : (st === "failed" ? " title=\"任务失败\"" : "");
  if (sid) {
    return `<button class="primary"${dis}${tip} onclick="if(this.disabled)return;setTab('overview');openDatasetSessionDrawer(STATE.vds.selectedId||'workspace','${esc(sid)}','gold')">查看会话</button>`;
  }
  return `<button class="ghost slim"${dis}${tip} onclick="if(this.disabled)return;setTab('overview')">回到图谱</button>`;
}

function taskEffectiveStatus(t) {
  if (!t) return "";
  if (TASK_DETAIL_LOG.id === t.id && TASK_DETAIL_LOG.status) return TASK_DETAIL_LOG.status;
  return t.status || "";
}

let TASK_DETAIL_LOG = { id: "", lines: [], offset: 0, status: "", logInflight: false };

async function pollTaskLogs(taskId) {
  const forTasksUi = STATE.tab === "tasks" && STATE.tasksSelectedId === taskId;
  const forDrawer = RAW_DRAWER.analyzeJobId === taskId;
  if (!forTasksUi && !forDrawer) return;
  if (TASK_DETAIL_LOG.logInflight) return;
  if (forTasksUi && TASK_DETAIL_LOG.id !== taskId) {
    TASK_DETAIL_LOG = { id: taskId, lines: [], offset: 0, status: "", logInflight: false };
    paintTaskLogPanel();
    refreshTaskDetailChrome();
  }
  TASK_DETAIL_LOG.logInflight = true;
  try {
    const off = TASK_DETAIL_LOG.id === taskId ? TASK_DETAIL_LOG.offset : 0;
    const j = await api(`/api/tasks/${encodeURIComponent(taskId)}?offset=${off}`);
    if (forTasksUi && STATE.tasksSelectedId !== taskId) return;
    if (TASK_DETAIL_LOG.id !== taskId) {
      TASK_DETAIL_LOG = { id: taskId, lines: [], offset: 0, status: j.status || "", logInflight: false };
    }
    TASK_DETAIL_LOG.status = j.status || TASK_DETAIL_LOG.status;
    const chunk = j.logs || [];
    if (off === 0) TASK_DETAIL_LOG.lines = chunk.slice();
    else if (chunk.length) TASK_DETAIL_LOG.lines.push(...chunk);
    TASK_DETAIL_LOG.offset = off + chunk.length;
    const idx = TASK_HUB.tasks.findIndex(x => x.id === taskId);
    if (idx >= 0 && j.status) {
      TASK_HUB.tasks[idx] = { ...TASK_HUB.tasks[idx], status: j.status, progress: j.progress || TASK_HUB.tasks[idx].progress };
      if (j.status === "running") TASK_HUB.running = Math.max(TASK_HUB.running, 1);
    }
    if (forTasksUi) {
      refreshTaskDetailChrome();
      paintTaskLogPanel();
    }
    if (forDrawer) paintRawDrawerAnalyze();
  } catch (_) { /* ignore */ }
  finally {
    TASK_DETAIL_LOG.logInflight = false;
  }
}

function refreshTasksListStatusChips() {
  if (STATE.tab !== "tasks") return;
  $$(".task-row[data-tid]").forEach(row => {
    const t = TASK_HUB.tasks.find(x => x.id === row.dataset.tid);
    if (!t) return;
    const st = t.status || "";
    const chip = row.querySelector(".chip");
    if (chip) {
      chip.className = `chip ${st === "done" ? "train" : st === "failed" || st === "stale" ? "neg" : ""}`;
      chip.textContent = RUN_ZH[st] || st;
    }
  });
}

function refreshTaskDetailChrome() {
  const sel = TASK_HUB.tasks.find(t => t.id === STATE.tasksSelectedId);
  if (!sel || STATE.tab !== "tasks") return;
  const st = taskEffectiveStatus(sel);
  const stEl = $("#taskDetailStatus");
  const actEl = $("#taskDetailActions");
  const progEl = $("#taskDetailProgress");
  if (stEl) stEl.innerHTML = `${taskStatusTag(st)}<span class="grow"></span><span class="faint mono" style="font-size:11px">${esc(sel.id)}</span>`;
  if (progEl) {
    const p = sel.progress || {};
    const pct = taskProgressPercent(sel);
    const label = p.label || (st === "running" ? "正在执行" : st === "done" ? "已完成" : st === "failed" ? "执行失败" : "等待执行");
    progEl.innerHTML = `<div class="progress-label"><span>${esc(label)}</span>${pct !== null ? `<span class="num">${pct}%</span>` : ""}</div>${pct !== null ? `<div class="task-progress-track"><i style="width:${pct}%"></i></div>` : ""}`;
  }
  if (actEl) {
    actEl.innerHTML = `${taskOpenAction({ ...sel, status: st })}${st === "stale" ? `<button class="ghost" onclick="dismissTask('${esc(sel.id)}')">从列表移除</button>` : ""}`;
  }
  const row = document.querySelector(`.task-row.on[data-tid="${sel.id}"]`);
  if (row) {
    const chip = row.querySelector(".chip");
    if (chip) {
      chip.className = `chip ${st === "done" ? "train" : st === "failed" || st === "stale" ? "neg" : ""}`;
      chip.textContent = RUN_ZH[st] || st;
    }
  }
  updateTasksBadge();
}

function paintTaskLogPanel() {
  const el = $("#taskLogBox");
  if (!el) return;
  const prevTop = el.scrollTop;
  const atBottom = prevTop + el.clientHeight >= el.scrollHeight - 30;
  const deduped = [];
  for (const l of TASK_DETAIL_LOG.lines) {
    if (deduped.length && deduped[deduped.length - 1] === l) continue;
    deduped.push(l);
  }
  el.innerHTML = deduped.length
    ? deduped.map(l => {
        const cls = /失败|error|Traceback/i.test(l) ? "err" : /✓ 完成|\] 完成$/.test(l) ? "ok" : "";
        const m = String(l).match(/^(\d{2}:\d{2}:\d{2})\s+([\s\S]*)$/);
        const body = m
          ? `<span class="ts">${esc(m[1])}</span>${esc(m[2])}`
          : esc(l);
        return `<div class="${cls}">${body}</div>`;
      }).join("")
    : `<span class="faint">暂无日志</span>`;
  // 贴底才跟随新日志；用户上翻阅读时保持当前位置，不被轮询刷新拽走
  if (atBottom) el.scrollTop = el.scrollHeight;
  else el.scrollTop = prevTop;
}

async function loadLedger() {
  const f = STATE.ledger || {};
  const qs = new URLSearchParams({ limit: "200" });
  if (f.tool) qs.set("tool", f.tool);
  if (f.actor) qs.set("actor", f.actor);
  if (f.sid) qs.set("sid", f.sid);
  if (f.project) qs.set("project", f.project);
  if (f.q) qs.set("q", f.q);
  const [ledRes, taskRes] = await Promise.all([
    api("/api/ledger?" + qs.toString()),
    api("/api/tasks").catch(() => ({ tasks: TASK_HUB.tasks, running: 0, queued: 0 })),
  ]);
  TASK_HUB.tasks = taskRes.tasks || [];
  TASK_HUB.running = taskRes.running || 0;
  TASK_HUB.queued = taskRes.queued || 0;
  updateTasksBadge();
  STATE.ledger.events = ledRes.events || [];
  STATE.ledger.tools = ledRes.tools || [];
  STATE.ledger.actors = ledRes.actors || [];
  paintLedgerView();
}

async function loadTasksOnly() {
  taskHubEnsure();
  try {
    const d = await api("/api/tasks");
    TASK_HUB.tasks = d.tasks || [];
    TASK_HUB.running = d.running || 0;
    TASK_HUB.queued = d.queued || 0;
    updateTasksBadge();
  } catch (e) {
    const msg = String(e.message || e);
    const hint = /not found/i.test(msg)
      ? "当前控制台进程仍是旧版本，未加载任务中心 API。请在本机项目根目录重新运行：python serve.py，然后刷新浏览器（Ctrl+F5）。"
      : msg;
    $("#view-tasks").innerHTML = `<div class="panel"><div class="panel-b"><div class="error-box"><b>任务中心不可用</b><div class="muted" style="margin:8px 0 12px">${esc(hint)}</div><button onclick="setTab('tasks')">重试</button></div></div></div>`;
    return;
  }
  if (!STATE.tasksSelectedId && TASK_HUB.tasks.length) {
    STATE.tasksSelectedId = TASK_HUB.tasks[0].id;
  }
  paintTasksView();
}

async function loadTasks() {
  taskHubEnsure();
  if ((STATE.tasksMode || "ledger") === "ledger") {
    await loadLedger();
    return;
  }
  await loadTasksOnly();
}

function taskProgressPercent(t) {
  const p = t && t.progress || {};
  const done = Number(p.done ?? p.completed ?? p.current ?? 0);
  const total = Number(p.total ?? p.max ?? 0);
  if (total > 0) return Math.max(0, Math.min(100, Math.round(done / total * 100)));
  if (t && t.status === "done") return 100;
  return null;
}

function renderDatasetDagHtml(graph) {
  const nodes = graph?.nodes || [];
  const edges = graph?.edges || [];
  const ws = graph?.workspace || {};
  if (!nodes.length) {
    return `<div class="dag-track"><div class="dag-col">${vdsNodeCardHtml({kind:"draft"}, ws)}</div></div>`;
  }
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const edgeMap = Object.fromEntries(edges.map(e => [`${e.from}->${e.to}`, e]));
  const childrenOf = {};
  const roots = [];
  for (const n of nodes) {
    const p = n.resolved_parent;
    if (p && byId[p]) (childrenOf[p] = childrenOf[p] || []).push(n);
    else roots.push(n);
  }
  // 挑选包含 head_pack 或后代最多的主干链向右展开，同层兄弟作为紧凑分支挂载在同一列下方
  const hasHeadDesc = id => {
    if (byId[id]?.is_head) return true;
    return (childrenOf[id] || []).some(c => hasHeadDesc(c.id));
  };
  const renderChainFromRoot = (rootNode, includeWorkspace) => {
    let cur = rootNode;
    const parts = [];
    while (cur && !visited.has(cur.id)) {
      visited.add(cur.id);
      parts.push(`<div class="dag-col">${vdsNodeCardHtml(cur, ws)}</div>`);
      const kids = childrenOf[cur.id] || [];
      if (!kids.length) break;
      const primary = kids.find(k => hasHeadDesc(k.id)) || kids[kids.length - 1];
      const sideKids = kids.filter(k => k.id !== primary.id);
      const e = edgeMap[`${cur.id}->${primary.id}`] || { id: `${cur.id}->${primary.id}`, from: cur.id, to: primary.id, reports: [], ledger_ops: [] };
      parts.push(vdsEdgeBridgeHtml(e));
      if (sideKids.length) {
        visited.add(primary.id);
        parts.push(`<div class="dag-col">
          ${vdsNodeCardHtml(primary, ws)}
          ${sideKids.map(sk => { visited.add(sk.id); return `<div style="opacity:.88;transform:scale(.96);transform-origin:left top"><div class="faint" style="font-size:11px;margin:2px 0 4px 4px">↳ 同基线派生分支 (${esc(cur.id)})：</div>${vdsNodeCardHtml(sk, ws)}</div>`; }).join("")}
        </div>`);
        const nextKids = childrenOf[primary.id] || [];
        if (!nextKids.length) { cur = primary; break; }
        const nextPrimary = nextKids.find(k => hasHeadDesc(k.id)) || nextKids[nextKids.length - 1];
        const ne = edgeMap[`${primary.id}->${nextPrimary.id}`] || { id: `${primary.id}->${nextPrimary.id}`, from: primary.id, to: nextPrimary.id, reports: [], ledger_ops: [] };
        parts.push(vdsEdgeBridgeHtml(ne));
        cur = nextPrimary;
      } else {
        cur = primary;
      }
    }
    if (includeWorkspace && ws?.dirty) {
      const draftEdge = edges.find(e => e.to === "workspace");
      if (draftEdge) parts.push(vdsEdgeBridgeHtml(draftEdge));
      parts.push(`<div class="dag-col">${vdsNodeCardHtml({kind:"draft"}, ws)}</div>`);
    }
    return `<div class="dag-track" style="margin-bottom:8px">${parts.join("")}</div>`;
  };

  const mainRoot = roots.find(r => hasHeadDesc(r.id)) || roots[0];
  const visited = new Set();
  const tracks = [];
  if (mainRoot) tracks.push(renderChainFromRoot(mainRoot, true));
  for (const r of roots) {
    if (!visited.has(r.id)) tracks.push(renderChainFromRoot(r, false));
  }
  for (const n of nodes) {
    if (!visited.has(n.id)) tracks.push(renderChainFromRoot(n, false));
  }
  return tracks.join("");
}

  if (STATE.vds.focusType === "edge") {
    const edge = (STATE.vds.graph.edges || []).find(e => e.id === STATE.vds.selectedEdge) || (STATE.vds.graph.edges || [])[0];
    if (!edge) { host.innerHTML = ""; return; }
    const rpts = edge.reports || [];
    const ops = edge.ledger_ops || [];
    host.innerHTML = `<div class="panel">
      <div class="panel-h">
        <h3>演进因果桥 · <span class="mono">${esc(edge.from)} ──► ${esc(edge.to === "workspace" ? "Workspace (未打包)" : edge.to)}</span></h3>
        <span class="grow"></span>
        <button type="button" class="ghost slim" onclick="selectVirtualDataset(${jsArg(edge.from)})">查看源包 ${esc(edge.from)}</button>
        <button type="button" class="primary slim" onclick="selectVirtualDataset(${jsArg(edge.to)})">查看目标数据集 ${esc(edge.to === "workspace" ? "Workspace" : edge.to)}</button>
      </div>
      <div class="panel-b">
        <div class="grid2">
          <div class="panel" style="margin-bottom:0;background:var(--ink-0)">
            <div class="panel-h"><h3>关联实测评估报告</h3><span class="hint">${fmt(rpts.length)} 份</span><span class="grow"></span>${edge.to !== "workspace" ? `<button type="button" class="ghost slim" onclick="openPackDiffDrawer(${jsArg(edge.from)}, ${jsArg(edge.to)})">完整指标 Diff →</button>` : ""}</div>
            <div class="report-list">
              ${rpts.length ? rpts.map(r => {
                const deltaKeys = Object.entries(r.deltas || {}).slice(0, 5);
                return `<div class="report-item clickable" onclick="openReportDrawer(${jsArg(r.report_id)})">
                  <div class="row"><span class="report-title">${esc(r.title || r.report_id)}</span><span class="grow"></span><span style="color:var(--gold);font-size:12px">阅读报告全文 →</span></div>
                  ${r.summary ? `<div class="report-sub">${esc(r.summary)}</div>` : ""}
                  ${deltaKeys.length ? `<div class="row" style="gap:6px;margin-top:4px">${deltaKeys.map(([k, v]) => `<span class="chip mono">${esc(k)}: ${esc(v.before)}→<b>${esc(v.after)}</b></span>`).join("")}</div>` : ""}
                </div>`;
              }).join("") : `<div class="empty" style="padding:26px 16px">${edge.to === "workspace" ? "工作区尚未打包，完成打包与学生实测后可通过 gt report publish 挂载报告" : "此演进段未挂载独立评估报告，右侧记录了期间的操作账本"}</div>`}
            </div>
          </div>
          <div class="panel" style="margin-bottom:0;background:var(--ink-0)">
            <div class="panel-h"><h3>驱动本次演进的操作审计账本</h3><span class="hint">${fmt(ops.length)} 条记录</span></div>
            <div class="ledger-feed">
              ${ops.length ? ops.map(op => `<div class="ledger-item">
                <div class="row" style="gap:7px">${actorBadgeHtml(op.actor)}<span class="tool-badge">${esc(op.tool || "")}</span><span class="mono faint">${esc(op.op_id || "")}</span><span class="grow"></span><span class="faint" style="font-size:11.5px">${esc(stamp(op.timestamp))}</span></div>
                <div class="ledger-reason">${esc(op.reason || "（未填原因）")}</div>
              </div>`).join("") : `<div class="empty" style="padding:26px 16px">该区间无显式 CLI/Web 账本记录（早期基线包）</div>`}
            </div>
          </div>
        </div>
      </div>
    </div>`;
    return;
  }

  const dsId = STATE.vds.selectedId || STATE.vds.graph.head_pack || "workspace";
  const isDraft = dsId === "workspace";
  const node = isDraft ? null : (STATE.vds.graph.nodes || []).find(n => n.id === dsId);
  const ws = STATE.vds.graph.workspace || {};
  const tab = STATE.vds.subTab || "overview";
  const parentId = isDraft ? ws.head_pack : node?.resolved_parent;
  const edgeKey = parentId ? `${parentId}->${dsId}` : "";
  const sessCnt = isDraft ? (ws.counts?.gold_sessions || ws.counts?.raw_sessions || 0) : (node?.sessions_count || 0);
  const trainCnt = isDraft ? ((ws.counts?.sft_train || 0) + (ws.counts?.dpo_train || 0)) : ((node?.sft_train || 0) + (node?.dpo_train || 0));

  const topBanner = isDraft
    ? `<div style="padding:10px 18px;background:rgba(217,180,103,.09);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px">
        <span class="tag t-running">动态演进草稿 (Working Tree)</span>
        <span class="muted">变更原因：${esc((ws.reasons || []).map(r => VDS_DIRTY_REASON_ZH[r] || r).join("；") || "存在未打包修改")}</span>
        <span class="grow"></span>
        <button type="button" class="ghost slim" onclick="buildWorkspaceFromGraph()">1. 构建 Build</button>
        <button type="button" class="primary slim" onclick="exportPackage({})">2. 打包生成新数据集</button>
      </div>`
    : `<div style="padding:10px 18px;background:rgba(95,185,196,.08);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px">
        <span class="cas-chip">${node?.cas_fidelity === "full" ? "CAS 完整不可变快照" : (node?.cas_fidelity === "backfilled" ? "历史 Build 校验回填快照" : "早期独立包 (仅训练切片冻结)")}</span>
        <span class="muted">训练切片读取自冻结包 <span class="mono">${esc(node?.name || dsId)}</span>${node?.cas_object_count ? `；关联 CAS 对象 ${fmt(node.cas_object_count)} 个` : "（无关联 Build 目录）"}。</span>
        <span class="grow"></span>
        ${node?.build_id ? `<span class="mono faint">build:${esc(String(node.build_id).slice(0, 10))}</span>` : ""}
        ${node?.name ? `<button type="button" class="ghost slim" onclick="openPackDocs(${jsArg(node.name)})">说明</button>` : ""}
        ${node?.name ? `<button type="button" class="ghost slim" onclick="openPackLengthStats(${jsArg(node.name)})">长度统计</button>` : ""}
        <button type="button" class="ghost slim" onclick="openPackEval(${jsArg(node?.name || dsId)})">门禁体检</button>
        ${node?.name ? `<button type="button" class="primary slim" onclick="downloadZip(${jsArg(node.name)})">下载</button>` : ""}
        ${node?.name ? `<button type="button" class="danger slim" onclick="deletePack(${jsArg(node.name)})">删除</button>` : ""}
      </div>`;

  host.innerHTML = `<div class="panel">
    <div class="panel-h">
      <h3>虚拟数据集条目 · <span class="mono" style="color:var(--gold)">${isDraft ? "Workspace (未打包草稿)" : esc(dsId)}</span></h3>
      ${parentId ? `<button type="button" class="chip" onclick="selectLineageEdge(${jsArg(edgeKey)})">派生自 ${esc(parentId)} · 查看演进因果</button>` : `<span class="chip">根基线数据集</span>`}
      <span class="grow"></span>
      <span class="faint" style="font-size:12px">${isDraft ? "实时可变区" : esc(stamp(node?.generated_at || ""))}</span>
    </div>
    ${topBanner}
    <div class="vds-subtabs">
      <button type="button" class="${tab === "overview" ? "active" : ""}" onclick="switchVdsSubTab('overview')">1. 概览与门禁体检</button>
      <button type="button" class="${tab === "train" ? "active" : ""}" onclick="switchVdsSubTab('train')">2. 训练数据<span class="cnt">${fmt(trainCnt)}</span></button>
      <button type="button" class="${tab === "gold" ? "active" : ""}" onclick="switchVdsSubTab('gold')">3. 黄金数据 (CAS 快照)<span class="cnt">${fmt(sessCnt)}</span></button>
      <button type="button" class="${tab === "raw" ? "active" : ""}" onclick="switchVdsSubTab('raw')">4. 原始数据 (归属范围)<span class="cnt">${fmt(sessCnt)}</span></button>
    </div>
    <div id="vdsSubBody"><div class="panel-b"><div class="loading">正在读取虚拟数据集视图…</div></div></div>
  </div>`;

  await loadVirtualDatasetSubView(dsId, tab);
}

function switchVdsSubTab(subTab) {
  STATE.vds.subTab = subTab;
  renderVdsDetailHost().catch(err => toast(err.message, "err"));
}

async function openPackDiffDrawer(beforeId, afterId) {
  openDrawer(`包间全维度指标对比 · ${beforeId} → ${afterId}`, "Eval Diff");
  const seq = DRAWER_REQUEST_SEQ;
  $("#drawerBody").innerHTML = `<div class="panel"><div class="panel-b"><div class="loading">正在对比两版数据集指标…</div></div></div>`;
  setDrawerFoot("");
  try {
    const d = await api(`/api/eval/diff?before=${encodeURIComponent(beforeId)}&after=${encodeURIComponent(afterId)}`);
    if (seq !== DRAWER_REQUEST_SEQ) return;
    $("#drawerBody").innerHTML = `<div class="panel"><div class="panel-h"><h3>${esc(beforeId)} → ${esc(afterId)}</h3></div><div class="panel-b">${renderEvalDiffBlock(d)}</div></div>`;
  } catch (err) {
    if (seq !== DRAWER_REQUEST_SEQ) return;
    $("#drawerBody").innerHTML = `<div class="error-box">对比异常：${esc(err.message || err)}</div>`;
  }
}

async function buildWorkspaceFromGraph() {
  try {
    const r = await api("/api/run", { method: "POST", body: JSON.stringify({ stage: "stage3", force: false }) });
    toast(r.status === "queued" ? "构建任务已加入排队，可在账本与任务页查看日志" : "已启动草稿构建 Build", "ok");
    if (r.job_id) watchJob(r.job_id, () => { if (STATE.tab === "overview") loadOverview(); });
  } catch (err) {
    toast(err.message, "err");
  }
}

async function openCollectDrawer() {
  openDrawer("采集外部源会话", "从 pi / Cursor 会话目录勾选未入库轨迹");
  setDrawerFoot("");
  $("#drawerBody").innerHTML = `<div id="collectDrawerHost"><div class="loading">正在扫描外部会话目录…</div></div>`;
  await loadCollect("#collectDrawerHost");
}

function renderVdsBreakdownHtml(bd) {
  if (!bd) return "";
  const projs = bd.projects || [];
  const byStage = bd.by_stage || {};
  const dpoSrc = bd.dpo_by_source || {};
  const patho = bd.pathologies || {};
  const maxp = Math.max(1, ...Object.values(patho));
  const pathoEntries = Object.entries(patho).sort((a, b) => b[1] - a[1]).slice(0, 6);
  return `<div class="grid2" style="margin-top:16px">
    <div class="panel" style="margin-bottom:0;background:var(--ink-0)">
      <div class="panel-h"><h3>本数据集项目分布与切分</h3><span class="hint">共 ${fmt(projs.length)} 个规范项目组</span></div>
      <div class="scroll" style="max-height:310px">
        <table>
          <thead><tr><th>项目组</th><th>切分</th><th class="n">SFT 样本</th><th class="n">DPO 对</th></tr></thead>
          <tbody>
            ${projs.map(p => `<tr>
              <td class="sid">${esc(p.project)}</td>
              <td><span class="chip ${esc(p.split)}">${esc(p.split)}</span></td>
              <td class="n">${fmt(p.sft_rows)}</td>
              <td class="n">${fmt(p.dpo_rows)}</td>
            </tr>`).join("") || emptyRow(4, "暂无项目切分数据")}
          </tbody>
        </table>
      </div>
    </div>
    <div class="panel" style="margin-bottom:0;background:var(--ink-0)">
      <div class="panel-h"><h3>本数据集样本构成与诊断</h3><span class="hint">随所选数据集版本动态切换</span></div>
      <div class="panel-b">
        <div class="sub-h" style="margin-top:0">SFT 会话阶段占比</div>
        ${segbar(PHASE.map(([k, t, c]) => ({v: byStage[k] || 0, c, t})), "thick")}
        <div class="legend">${PHASE.map(([k, t, c]) => `<span><i style="background:${c}"></i>${t} <b>${fmt(byStage[k] || 0)}</b></span>`).join("")}</div>
        <div class="sub-h">DPO 偏好对来源构成</div>
        <div class="row">${Object.entries(dpoSrc).map(([k, v]) => `<span class="chip">${esc(DPO_SRC_ZH[k] || k)} <b>${fmt(v)}</b></span>`).join("") || `<span class="faint">–</span>`}</div>
        ${pathoEntries.length ? `<div class="sub-h">本版拦截/诊断的病态分布</div><div class="patho">${pathoEntries.map(([k, v]) => `
          <span class="name">${esc(PATHO_ZH[k] || k)}</span>
          <span class="track"><i style="width:${Math.max(3, Math.round(v / maxp * 100))}%"></i></span>
          <b>${fmt(v)}</b>`).join("")}</div>` : ""}
      </div>
    </div>
  </div>`;
}

  try {
    if (tab === "overview") {
      const ov = await api(`/api/datasets/${encodeURIComponent(dsId)}`);
      if (STATE.vds.selectedId && STATE.vds.selectedId !== dsId) return;
      if (ov.kind === "draft") {
        const wc = ov.workspace?.counts || {};
        box.innerHTML = `<div class="panel-b">
          <div class="vds-kpi-grid">
            <div class="vds-kpi"><div class="k">预计 SFT 窗口 (Train / Eval)</div><div class="v">${fmt(wc.sft_train)} <span class="faint" style="font-size:14px">/ ${fmt(wc.sft_eval)}</span></div><div class="s">工作区 Stage 3 当前切片</div></div>
            <div class="vds-kpi"><div class="k">预计 DPO 偏好对 (Train / Eval)</div><div class="v">${fmt(wc.dpo_train)} <span class="faint" style="font-size:14px">/ ${fmt(wc.dpo_eval)}</span></div><div class="s">剪枝 + 折叠 + 压缩改写</div></div>
            <div class="vds-kpi"><div class="k">项目 / 黄金会话 / 原始会话</div><div class="v">${fmt(wc.projects_count)} <span class="faint" style="font-size:14px">/ ${fmt(wc.gold_sessions)} / ${fmt(wc.raw_sessions)}</span></div><div class="s">未提纯会话 ${fmt(ov.workspace?.unpurified_count || 0)} 条</div></div>
            <div class="vds-kpi"><div class="k">待打包账本操作</div><div class="v">${fmt((ov.ledger_ops || []).length)} <span class="faint" style="font-size:14px">条</span></div><div class="s">自 ${esc(ov.parent_pack || "初始")} 以来的增量动作</div></div>
          </div>
          ${renderVdsBreakdownHtml(ov.breakdown)}
        </div>`;
      } else {
        const edge = ov.incoming_edge;
        const rpt = (edge?.reports || [])[0];
        box.innerHTML = `<div class="panel-b">
          <div class="vds-kpi-grid">
            <div class="vds-kpi"><div class="k">SFT 训练 / 验证行数 (LF)</div><div class="v">${fmt(ov.sft_train)} <span class="faint" style="font-size:14px">/ ${fmt(ov.sft_eval)}</span></div><div class="s">${esc(ov.format_label || ov.profile || "标准导出")}</div></div>
            <div class="vds-kpi"><div class="k">DPO 偏好对 (Train / Eval)</div><div class="v">${fmt(ov.dpo_train)} <span class="faint" style="font-size:14px">/ ${fmt(ov.dpo_eval)}</span></div><div class="s">包体积 ${esc(((ov.size_bytes || 0) / 1048576).toFixed(1))} MB</div></div>
            <div class="vds-kpi"><div class="k">覆盖项目组 / 溯源会话</div><div class="v">${fmt(ov.projects_count)} <span class="faint" style="font-size:14px">款 / ${fmt(ov.sessions_count)} 会话</span></div><div class="s">CAS 归档对象 ${fmt(ov.cas_object_count || 0)} 个</div></div>
            <div class="vds-kpi"><div class="k">长度闸门与体检</div><div class="v" style="font-size:16.5px;color:${ov.length_gate_ok ? "var(--pos)" : "var(--gold)"}">${ov.length_gate_ok ? "✅ 长度闸门已生效" : "⚠ 打包时跳过长度闸门"}</div><div class="s"><a href="javascript:void(0)" onclick="openPackEval(${jsArg(ov.name)})">点此运行 8 项硬性门禁核验 →</a></div></div>
          </div>
          ${rpt ? `<div class="panel" style="margin-bottom:0;background:var(--ink-0)"><div class="panel-h"><h3>生成本包的实测评估报告</h3><span class="grow"></span><button type="button" class="ghost slim" onclick="openReportDrawer(${jsArg(rpt.report_id)})">阅读完整报告 →</button></div><div class="panel-b"><div style="font-weight:600;margin-bottom:4px">${esc(rpt.title)}</div><div class="muted">${esc(rpt.summary || "")}</div></div></div>` : ""}
          ${renderVdsBreakdownHtml(ov.breakdown)}
        </div>`;
      }
      return;
    }

    if (tab === "train") {
      const f = STATE.vds.trainFilter;
      const qs = new URLSearchParams({ kind: f.kind || "all", split: f.split || "", project: f.project || "", q: f.q || "", offset: String(f.offset || 0), limit: "40" });
      const res = await api(`/api/datasets/${encodeURIComponent(dsId)}/train?` + qs.toString());
      window._VDS_LAST_TRAIN_ROWS = res.rows || [];
      box.innerHTML = `
        <div class="toolbar">
          <select id="vdsTrKind"><option value="all"${f.kind==="all"?" selected":""}>SFT + DPO</option><option value="sft"${f.kind==="sft"?" selected":""}>仅 SFT 窗口</option><option value="dpo"${f.kind==="dpo"?" selected":""}>仅 DPO 偏好对</option></select>
          <select id="vdsTrSplit"><option value=""${!f.split?" selected":""}>Train + Eval</option><option value="train"${f.split==="train"?" selected":""}>仅 Train</option><option value="eval"${f.split==="eval"?" selected":""}>仅 Eval</option></select>
          <select id="vdsTrProj"><option value="">所有项目 (${(res.projects||[]).length})</option>${(res.projects||[]).map(p => `<option value="${esc(p)}"${f.project===p?" selected":""}>${esc(p)}</option>`).join("")}</select>
          <input type="text" id="vdsTrQ" class="filter-search" placeholder="搜索样本 ID、会话或目标步文本…" value="${esc(f.q || "")}" />
          <span class="grow"></span>
          <span class="count">匹配 <b>${fmt(res.total)}</b> 条冻结切片</span>

                <td class="n">${esc(String(r.sample_weight ?? 1))}×</td>

              </tr>`).join("") || emptyRow(7, "当前筛选条件下无训练切片")}
            </tbody>
          </table>
        </div>
        <div class="toolbar bottom">
          <button type="button" class="slim" ${f.offset <= 0 ? "disabled" : ""} id="vdsTrPrev">上一页</button>
          <span class="muted" style="font-size:12px">第 ${fmt(Math.floor((f.offset||0)/40)+1)} 页</span>
          <button type="button" class="slim" ${(f.offset || 0) + 40 >= (res.total || 0) ? "disabled" : ""} id="vdsTrNext">下一页</button>
        </div>`;
      const reloadTr = resetOffset => {
        f.kind = $("#vdsTrKind").value;

        f.q = $("#vdsTrQ").value;

      $("#vdsTrProj").onchange = () => reloadTr(true);
      $("#vdsTrQ").onkeydown = e => { if (e.key === "Enter") reloadTr(true); };
      $("#vdsTrPrev").onclick = () => { f.offset = Math.max(0, (f.offset || 0) - 40); reloadTr(false); };
      $("#vdsTrNext").onclick = () => { f.offset = (f.offset || 0) + 40; reloadTr(false); };
      return;
    }

    if (tab === "gold") {
      const f = STATE.vds.goldFilter;
      const qs = new URLSearchParams({ project: f.project || "", q: f.q || "" });
      const res = await api(`/api/datasets/${encodeURIComponent(dsId)}/gold?` + qs.toString());
      box.innerHTML = `
        <div class="toolbar">
          <select id="vdsGoProj"><option value="">所有项目 (${(res.projects||[]).length})</option>${(res.projects||[]).map(p => `<option value="${esc(p)}"${f.project===p?" selected":""}>${esc(p)}</option>`).join("")}</select>
          <input type="text" id="vdsGoQ" class="filter-search" placeholder="搜索会话 ID、项目或主导模型…" value="${esc(f.q || "")}" />

          <span class="count">共 <b>${fmt(res.total)}</b> 条黄金会话（点击查看完整对话回复与 CAS 三态血缘）</span>

    ? "恢复本会话 SFT 纳入工作区草稿"

function adoptCell(s) {
  if (!s.adopted) {
    return `<div class="adopt"><span class="chip">未分析</span><span class="faint">尚未生成黄金</span></div>`;
  }
  const st = SCRIPT_ZH[s.gold_status] || "已分析";
  const when = s.analyzed_at ? ` title="分析于 ${esc(stamp(s.analyzed_at))}"` : "";
  return `<div class="adopt"${when}><span class="chip train">已分析</span><span class="faint">${esc(st)}</span></div>`;
}
function kb(n) {
  n = Number(n) || 0;
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  return Math.max(1, Math.round(n / 1024)) + " KB";
}
function syncPickButtons() {
  const n = (STATE.raw.pickIds || []).length;
  const suffix = n ? `（${n}）` : "";
  const ingest = $("#pickIngest");
  const analyze = $("#pickGo");
  if (ingest) ingest.textContent = `采集所选${suffix}`;
  if (analyze) analyze.textContent = `采集并分析${suffix}`;
}
function togglePick(id, on) {
  const ids = new Set(STATE.raw.pickIds || []);
  if (on) ids.add(id); else ids.delete(id);
  STATE.raw.pickIds = [...ids];
  syncPickButtons();
}
function pickGroupLabel(project, origin) {
  const p = String(project || "").trim();
  if (!p) return "未命名项目";
  if (origin === "cursor") return p.replace(/^d-/, "").replace(/-/g, " · ");
  if (p.startsWith("--D--")) return p.slice(5).replace(/-/g, " · ");
  if (p.includes("\\") || p.includes("/")) {
    const parts = p.split(/[/\\]/).filter(Boolean);
    return parts[parts.length - 1] || p;
  }
  return p;
}
function pickGroupKey(s) {
  return String(s.project || s.id.split("/")[0] || "其他");
}
function filterPickRows(rows, filter) {
  if (filter === "new") return rows.filter(s => !s.adopted);
  if (filter === "adopted") return rows.filter(s => s.adopted);
  return rows;
}
function groupPickRows(rows) {
  const map = new Map();
  for (const s of rows) {
    const k = pickGroupKey(s);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(s);
  }
  return [...map.entries()]
    .map(([key, items]) => ({
      key,
      label: pickGroupLabel(key, items[0]?.origin),
      items: items.sort((a, b) => String(b.timestamp).localeCompare(String(a.timestamp))),
      latest: items.reduce((m, s) => (String(s.timestamp) > m ? String(s.timestamp) : m), ""),
    }))
    .sort((a, b) => b.latest.localeCompare(a.latest));
}
function pickOpenSet() {
  return new Set(STATE.raw.pickOpen || []);
}
function setPickGroupOpen(key, open) {
  const s = pickOpenSet();
  if (open) s.add(key); else s.delete(key);
  STATE.raw.pickOpen = [...s];
}
function bindPickGroups() {
  $$("#pickList .pick-group-h").forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const g = btn.closest(".pick-group");
      const key = g?.dataset.gkey;
      if (!key) return;
      const open = !g.classList.contains("open");
      g.classList.toggle("open", open);
      btn.setAttribute("aria-expanded", open);
      setPickGroupOpen(key, open);
    };
  });
}
function renderPickList(rows, ids, pickOn) {
  const groups = groupPickRows(rows);
  if (!groups.length) return `<div class="empty">没有符合条件的会话</div>`;
  const open = pickOpenSet();
  if (pickOn) {
    for (const g of groups) {
      if (g.items.some(s => s.id === pickOn)) open.add(g.key);
    }
    STATE.raw.pickOpen = [...open];
  }
  return groups.map(g => {
    const isOpen = open.has(g.key);
    return `<div class="pick-group ${isOpen ? "open" : ""}" data-gkey="${esc(g.key)}">
    <button type="button" class="pick-group-h" aria-expanded="${isOpen}">
      <span class="caret"></span>
      <span class="grow" style="min-width:0"><b>${esc(g.label)}</b></span>
      <span class="faint">${fmt(g.items.length)} 条</span>
    </button>
    <div class="pick-group-body">
    ${g.items.map(s => `<div class="pick-row ${pickOn===s.id?"on":""}" data-id="${esc(s.id)}" data-gkey="${esc(g.key)}">
      <input type="checkbox" data-pick="${esc(s.id)}" ${ids.has(s.id)?"checked":""} aria-label="选择">
      <div>
        <div class="pick-title">${esc(s.title || s.session_id)}</div>
        <div class="pick-path" title="${esc(s.id)}">${esc(s.id)}</div>
        ${s.project && s.project !== s.id && s.project !== s.id.split("/")[0]
          ? `<div class="pick-path" title="${esc(s.project)}">cwd ${esc(s.project)}</div>` : ""}
        <div class="faint" style="font-size:11px;margin-top:2px">${stamp(s.timestamp)} · ${kb(s.bytes)}
          ${s.adopted ? ` · <span class="chip train">已加入</span>` : ""}</div>
      </div>
    </div>`).join("")}
    </div>
  </div>`;
  }).join("");
}

  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }

/* ------------------------------ 血缘与差异计算 ------------------------------ */
function lcsDiff(a, b) {
  const n = a.length, m = b.length;
  if (n * m > 250000) return null;
  const dp = Array.from({length: n + 1}, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push(["eq", a[i]]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push(["del", a[i++]]); }
    else ops.push(["ins", b[j++]]);
  }
  while (i < n) ops.push(["del", a[i++]]);
  while (j < m) ops.push(["ins", b[j++]]);
  return ops;
}
function tokenPair(l, r) {
  const cut = s => s.match(/[A-Za-z0-9_./:+#-]+|\s+|[\u4e00-\u9fff]|./g) || [];
  const ops = lcsDiff(cut(l), cut(r));
  if (!ops) return {l:`<del>${esc(l)}</del>`, r:`<ins>${esc(r)}</ins>`};
  let L = "", R = "";
  for (const [op, t] of ops) {
    if (op === "eq") { L += esc(t); R += esc(t); }
    else if (op === "del") L += `<del>${esc(t)}</del>`;
    else R += `<ins>${esc(t)}</ins>`;
  }
  return {l:L, r:R};
}
function splitThinkBody(text) {
  const t = String(text ?? "");
  const m = t.match(/^<think>\s*([\s\S]*?)\s*<\/think>\s*/i);
  if (!m) return {think: "", body: t.trim()};
  return {think: (m[1] || "").trim(), body: t.slice(m[0].length).trim()};
}
function thinkDisplayText(parts) {
  // 无思考时绝不把 tool 正文塞进 Rejected/Chosen 思考栏
  const think = String((parts && parts.think) || "").trim();
  if (think) return think;
  const body = String((parts && parts.body) || "").trim();
  if (!body || /<tool_call\b/i.test(body)) return "";
  return body;
}
/** 偏好对照：思考 + 动作并入同一卡片；无思考 / 无工具时给明确空态。 */
function renderDpoPreferenceCard(chosen, rejected, opts = {}) {
  const cParts = splitThinkBody(chosen), rParts = splitThinkBody(rejected);
  const cThink = thinkDisplayText(cParts), rThink = thinkDisplayText(rParts);
  const cBody = String(cParts.body || "").trim();
  const rBody = String(rParts.body || "").trim();
  const sameAction = opts.sameAction === true
    || (!!cBody && !!rBody && cBody === rBody)
    || (!cBody && !rBody);
  const hint = opts.hint || (sameAction && (cBody || rBody)
    ? "工具动作相同，差异在思维链；右侧是 Chosen"
    : "相同上下文下，模型应偏好右侧 Chosen");

  let thinkHtml;
  if (!rThink && !cThink) {
    thinkHtml = `<div class="diff-cap">思考</div><div class="faint">双方均无思考内容</div>`;
  } else {
    thinkHtml = buildDiff(
      rThink || "（无思考）", cThink || "（无思考）",
      [`Rejected 思考 · ${fmt(rThink.length)} 字`, `Chosen 思考 · ${fmt(cThink.length)} 字`]
    ).html;
  }

  let actionHtml;
  if (!cBody && !rBody) {
    actionHtml = `<div class="diff-cap">工具动作</div><div class="faint">无工具调用</div>`;
  } else if (sameAction) {
    actionHtml = `<div class="diff-cap">共同工具动作<span class="hint" style="margin-left:8px">两边相同，只展示一份</span></div>
      <pre class="json">${esc(cBody || rBody)}</pre>`;
  } else {
    actionHtml = `<div class="diff-cap" style="margin-bottom:8px">动作对照</div>${buildDiff(
      rBody || "（无工具）", cBody || "（无工具）",
      ["Rejected 动作", "Chosen 动作"]
    ).html}`;
  }

  return `<div class="panel"><div class="panel-h"><h3>偏好对照</h3><span class="hint">${esc(hint)}</span></div>
    <div class="panel-b">
      <div class="pref-block">${thinkHtml}</div>
      <div class="pref-block">${actionHtml}</div>
    </div></div>`;
}
function buildDiff(oldS, newS, caps) {
  oldS = String(oldS ?? ""); newS = String(newS ?? "");
  const capL = (caps && caps[0]) || "原文", capR = (caps && caps[1]) || "模型改写";
  if (oldS === newS) return {html:`<div class="faint">两边相同</div>`, changes:0};
  const ops = lcsDiff(oldS.split("\n"), newS.split("\n"));
  const box = (l, r) => `<div class="diff-grid"><div><div class="diff-cap">${capL}</div><div class="diff">${l}</div></div><div><div class="diff-cap">${capR}</div><div class="diff">${r}</div></div></div>`;
  if (!ops) return {html: box(esc(oldS), esc(newS)), changes:-1};
  const rows = [];
  for (let k = 0; k < ops.length;) {
    if (ops[k][0] === "eq") { rows.push({l:esc(ops[k][1]), r:esc(ops[k][1]), eq:true}); k++; continue; }
    const dels = [], ins = [];
    while (k < ops.length && ops[k][0] !== "eq") { (ops[k][0] === "del" ? dels : ins).push(ops[k][1]); k++; }
    for (let t = 0; t < Math.max(dels.length, ins.length); t++) {
      const lt = dels[t], rt = ins[t];
      if (lt != null && rt != null) { const td = tokenPair(lt, rt); rows.push({l:td.l, r:td.r, eq:false}); }
      else rows.push({l: lt != null ? `<del>${esc(lt)}</del>` : "", r: rt != null ? `<ins>${esc(rt)}</ins>` : "", eq:false});
    }
  }
  const L = [], R = [];
  for (let i = 0; i < rows.length;) {
    if (!rows[i].eq) { L.push(rows[i].l); R.push(rows[i].r); i++; continue; }
    let j = i; while (j < rows.length && rows[j].eq) j++;
    if (j - i > 6) {
      L.push(rows[i].l, `<span class="faint">… ${j - i - 2} 行未改</span>`, rows[j - 1].l);
      R.push(rows[i].r, `<span class="faint">… ${j - i - 2} 行未改</span>`, rows[j - 1].r);
    } else for (let t = i; t < j; t++) { L.push(rows[t].l); R.push(rows[t].r); }
    i = j;
  }
  return {html: box(L.join("\n"), R.join("\n")), changes: rows.filter(r => !r.eq).length};
}
/* 左右栏滚动联动：按比例同步，事件捕获委托，自动覆盖所有 .diff-grid（DPO 对照 / 复核改写卡） */
let DIFF_SYNC_LOCK = 0;
document.addEventListener("scroll", e => {
  const el = e.target;
  if (!(el instanceof Element) || !el.classList.contains("diff")) return;
  const grid = el.closest(".diff-grid");
  if (!grid || Date.now() < DIFF_SYNC_LOCK) return;
  const boxes = grid.querySelectorAll(":scope > div > .diff");
  if (boxes.length !== 2) return;
  const other = boxes[0] === el ? boxes[1] : boxes[0];
  const maxA = el.scrollHeight - el.clientHeight, maxB = other.scrollHeight - other.clientHeight;
  if (maxA > 2 && maxB > 2) {
    other.scrollTop = Math.round((el.scrollTop / maxA) * maxB);
    DIFF_SYNC_LOCK = Date.now() + 60;
  }
}, true);

function cheapGist(a, b) {
  const A = String(a ?? "").split("\n"), B = String(b ?? "").split("\n");
  for (let i = 0; i < Math.max(A.length, B.length); i++) if ((A[i] || "") !== (B[i] || "")) return short(oneLine(B[i] || A[i] || "有改动"), 72);
  return "有改动";
}

        const callsTxt = (s.tool_calls || []).map(c => `${c.name}${c.args_preview ? `(${short(c.args_preview, 40)})` : ""}`).join(", ") || "STOP (无工具)";
        const gist = short(oneLine(s.gold_thinking || s.raw_thinking || s.text || "（无文本）"), 110);
        const gateBtn = (!linData.readonly && s.in_gold) ? `<button type="button" class="toggle-pill ${s.excluded ? "is-off" : ""}" data-gold-sid="${esc(linData.session_id || '')}" data-gold-mid="${esc(s.msg_id)}" onclick="event.stopPropagation()"><i></i>${s.excluded ? "已排除 · 恢复" : "排除此步"}</button>` : "";
        return `<details class="lineage-step" data-ls-mid="${esc(s.msg_id)}">
          <summary>
            <span class="num faint">#${s.step_index + 1}</span>
            <span class="ls-state ls-${esc(s.state)}">${esc(LINEAGE_STATE_ZH[s.state] || s.state)}</span>
            <span class="mono faint">${esc(String(s.msg_id).slice(0, 8))}</span>
            ${s.highlight_weight ? `<span class="chip model">×${esc(s.highlight_weight)}</span>` : ""}
            ${s.text && String(s.text).trim() ? `<span class="chip train">含对外回复</span>` : ""}
            <span class="muted" style="flex:1;min-width:180px">${esc(gist)}</span>
            <span class="mono faint" style="font-size:11px">${esc(short(callsTxt, 68))}</span>
            ${gateBtn}
          </summary>
          <div class="lineage-step-body">
            ${s.reason ? `<div class="muted" style="margin-bottom:8px;font-size:12px"><b>决策血缘：</b>${esc(s.reason)}</div>` : ""}
            ${(s.pathologies || []).length ? `<div class="row" style="gap:6px;margin-bottom:8px">${s.pathologies.map(p => `<span class="chip">${esc(PATHO_ZH[p] || p)}</span>`).join("")}</div>` : ""}
            <div class="lineage-diff-slot"></div>
          </div>
        </details>`;
      }).join("") : `<div class="empty" style="padding:22px">当前筛选下没有步骤</div>`}
    </div>
  </div>`;

  const ledgerHtml = `<details class="panel" ${leds.length ? "open" : ""}><summary class="panel-h"><h3>3. 本会话关联操作账本</h3><span class="hint">${fmt(leds.length)} 条记录</span></summary>
    <div class="ledger-feed">
      ${leds.length ? leds.map(ev => `<div class="ledger-item">
        <div class="row" style="gap:8px">${actorBadgeHtml(ev.actor)}<span class="tool-badge">${esc(ev.tool || "")}</span><span class="mono faint">${esc(ev.op_id || "")}</span><span class="grow"></span><span class="faint">${esc(stamp(ev.timestamp))}</span></div>
        <div class="ledger-reason">${esc(ev.reason || "–")}</div>
      </div>`).join("") : `<div class="empty" style="padding:18px">暂无针对该会话的单独操作记录</div>`}
    </div></details>`;

  return `${turnsHtml}${stepsHtml}${ledgerHtml}`;
}

function bindLineageEvents(linData, containerSelector = "#goldViewBody") {
  const root = $(containerSelector);
  if (!root) return;
  const stepMap = Object.fromEntries((linData.steps || []).map(s => [s.msg_id, s]));
  $$(`${containerSelector} [data-lf]`).forEach(btn => {
    btn.onclick = () => {
      STATE.lineageFilter = btn.dataset.lf;
      root.innerHTML = renderLineageHtml(linData);
      bindLineageEvents(linData, containerSelector);
    };
  });
  $$(`${containerSelector} details.lineage-step`).forEach(det => {
    det.ontoggle = () => {
      if (!det.open) return;
      const slot = det.querySelector(".lineage-diff-slot");
      if (!slot || slot.dataset.rendered) return;
      const st = stepMap[det.dataset.lsMid];
      if (!st) return;
      let thinkHtml = "";
      if (st.state === "pruned") {
        thinkHtml = `<div class="diff-cap">被剪除的原始思考 (Rejected Thinking)</div><pre class="diff">${esc(st.raw_thinking || st.text || "（空）")}</pre>`;
      } else if (st.changed || (st.raw_thinking && st.gold_thinking && st.raw_thinking !== st.gold_thinking)) {
        thinkHtml = buildDiff(st.raw_thinking || "", st.gold_thinking || "", ["原始思考 (Raw)", "黄金思考 (Gold)"]).html;
      } else {
        thinkHtml = `<pre class="diff">${esc(st.gold_thinking || st.raw_thinking || "（无思考内容）")}</pre>`;
      }
      const replyHtml = (st.text && String(st.text).trim())
        ? `<div style="margin-top:10px"><div class="diff-cap">助手对外回复内容 (${chars(String(st.text).length)})</div><div class="bubble reply" style="margin:6px 0 0"><div class="md">${md(st.text)}</div></div></div>`
        : "";
      slot.innerHTML = thinkHtml + replyHtml;
      slot.dataset.rendered = "1";
    };
  });
  bindGoldStepGates();
}

function paintGoldLineage(linData) {
  const body = $("#goldViewBody");
  if (!body) return;
  body.innerHTML = renderLineageHtml(linData);
  bindLineageEvents(linData, "#goldViewBody");
}

function renderGoldSampleDetail(row, kind) {
