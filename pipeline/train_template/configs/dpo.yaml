### 27B DPO 基础配置。底座必须是 SFT 合并后的模型，且不设 ref_model：
### LoRA + 无 ref_model 时，reference 前向 = 关掉 adapter 的底座 = SFT 模型，不会再加载第二份 27B。
### 拿原始 base 当底座/参考会把模型推崩（乱码、think 不闭合、不再调工具）。
### autotrain.py 会按方案覆盖带 [auto] 的键。

### model
model_name_or_path: null                             # [auto] SFT 合并目录
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: false

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 32
lora_target: gate_proj,up_proj,down_proj
pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset_dir: null                                    # [auto]
dataset: null                                        # [auto] settings.yaml: project.datasets.<阶段>.train
eval_dataset: null                                   # [auto] settings.yaml: project.datasets.<阶段>.eval
template: null                                       # [auto] settings.yaml: project.template
cutoff_len: null                                     # [auto]
packing: false
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: null                                     # [auto]
logging_steps: 5
save_steps: 25
save_total_limit: 2
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4                       # [auto] 多卡时减小，保持全局 batch = 4
learning_rate: 1.0e-5                                # 8B 实测 5e-5 会把模型推崩
num_train_epochs: 3.0                                # 100 对 / batch 4 = 25 步/epoch
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true

### eval：训练中关闭，省显存给更长的 cutoff
per_device_eval_batch_size: 1
eval_strategy: "no"
