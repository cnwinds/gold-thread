# 本机路径、项目设置与全局开关。换机器、做新训练包都只改这个文件。
# 本目录是模板：不要直接开训。复制到 packages/<包名>/ 后改路径再训（见 TEMPLATE.md / docs/LAYOUT.md）。

# ---------- 项目：用这个目录做新的训练包时改这一段 ----------
project:
  name: GoldThread                         # 显示用
  merged_prefix: Qwen3.8-27B-goldthread    # 合并模型目录名 = <merged_prefix>-<阶段>-<运行名>
  template: qwen3_8                        # LLaMA-Factory 模板，同时用于训练与合并；必须与数据的工具调用格式配套
  model_type: qwen3_5                      # 底座 config.json 的 model_type；不一致时警告（方案表的显存数据按它实测）
  datasets:                                # 各阶段使用的 data/dataset_info.json 键
    sft:  {train: gt_sft_train_lf, eval: gt_sft_eval_lf}
    dpo:  {train: gt_dpo_train_lf, eval: gt_dpo_eval_lf}
    eval: {eval: gt_sft_eval_lf}           # autotrain.py eval 与合并后冒烟用的验证集

# ---------- 本机路径 ----------
# 复制成 packages/<包名>/ 后务必改成：
#   work_dir:   /data/work/<包名>
#   saves_dir:  /cloud/cloud-ssd1/packages/<包名>/saves
#   merged_dir: /cloud/cloud-ssd1/packages/<包名>/models

python: /usr/local/miniconda3/envs/py312/bin/python
base_model: /model/ModelScope/Qwen/Qwen3.8-27B
sft_merged: ""
work_dir: /data/work/_template
saves_dir: /cloud/cloud-ssd1/packages/_template/saves
merged_dir: /cloud/cloud-ssd1/packages/_template/models

length_tokenizer: /model/ModelScope/Qwen/Qwen2.5-0.5B-Instruct
llamafactory_dir: /opt/LLaMA-Factory

min_free_gb_work: 20
min_free_gb_saves: 2
min_free_gb_merge: 53
clean_work_on_success: true

max_attempts: 4
auto_fix_install: true
gpu_busy_mb: 2048
timeout_hours: 8
probe_before_train: true   # 正式 sft/dpo 开训前先探测；可用 --no-probe 跳过
probe_max_peak_gb: 70      # 探测时训练进程打印的 max_memory_allocated 达到该值就继续降 cutoff；80GB 卡留约 10GB 给缓存与碎片
train_longest_first: true  # 全量按 token 从长到短，尽早暴露 OOM
fill_missing_tools_from_sft: true  # DPO 行缺 tools 且 SFT 全部行共用一份工具定义时，在过滤副本里补上（data/ 不改）
