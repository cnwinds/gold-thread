### 冒烟用 DPO：Qwen3-8B，只跑 50 对
### 用途：只验证「数据格式 + 流程」能跑通，不追求质量
### 注意：正式 DPO 必须用 train_dpo_qwen3_8b.yaml（内置了必需的 ref_model，否则模型会被推崩）
### model
model_name_or_path: /data/models/Qwen3-8B
adapter_name_or_path: /data/saves/smoke-qwen3-8b-sft
trust_remote_code: true
flash_attn: fa2

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset_dir: /data/goldthread/03_train
dataset: pi_dpo_preference_pairs_train_v2
eval_dataset: pi_dpo_preference_pairs_eval_v2
template: qwen3
cutoff_len: 8192
packing: false
overwrite_cache: true
preprocessing_num_workers: 8
max_samples: 50                                      # 冒烟：只跑 50 对

### output
output_dir: /data/saves/smoke-qwen3-8b-dpo
logging_steps: 5
save_steps: 50
save_total_limit: 1
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-5           # 与正式配置一致（5e-5 会把模型推崩）
num_train_epochs: 1.0
bf16: true
gradient_checkpointing: true
