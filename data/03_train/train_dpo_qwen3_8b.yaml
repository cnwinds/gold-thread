### Qwen3-8B 的 DPO（SFT 达标后跑，全量 100 对）
### model
# 关键：参考模型必须是 SFT 模型（拿 base 当 ref 会推崩，见 RESULT.md）
# 与 27B 同方案：以 SFT 合并模型为 base 训新的 DPO LoRA、不设 ref_model，
# ref 前向走 disable_adapter() = SFT 模型，不再额外加载 8bit ref
model_name_or_path: /data/models/qwen3-8b-merged
trust_remote_code: true
flash_attn: fa2

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 32
lora_target: all
enable_liger_kernel: false        # DPO 要 logits，融合 CE 用不上
pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset_dir: /data/goldthread/03_train
dataset: pi_dpo_preference_pairs_train_v2w      # 已按“保留最近 4 步”裁窗，见 prep_dpo_window.py
eval_dataset: pi_dpo_preference_pairs_eval_v2w
template: qwen3
cutoff_len: 4096
packing: false
overwrite_cache: true
preprocessing_num_workers: 8

### output
# 导出时 model_name_or_path 填 /data/models/qwen3-8b-merged（DPO 适配器叠在 SFT 合并模型上）
output_dir: /data/saves/qwen3-8b-goldthread-dpo
logging_steps: 5
save_steps: 100
save_total_limit: 2
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-5           # 94 对样本、23 步，5e-5 直接把模型推崩
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true

### eval
per_device_eval_batch_size: 1
eval_strategy: "no"          # 同 SFT：DPO 分支不吃融合 CE，训练中评测易 OOM，训完单跑
