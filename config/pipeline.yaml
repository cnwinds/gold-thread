# =============================================================================
# Agent 训练数据管线配置 (stage1 -> stage2 -> stage3)
# 修改此文件后，Web 控制台点「重跑」即可，无需改代码。
# =============================================================================

paths:
  # pi 会话日志根目录（只读）
  sessions_dir: "~/.pi/agent/sessions"
  # 管线数据根目录（raw / gold / train / state），相对路径按项目根目录解析
  data_dir: "data"
  # pi 模型配置（读取 provider / baseUrl / apiKey）
  pi_models_json: "~/.pi/agent/models.json"

llm:
  # 模型参与环节统一使用该模型（通过 pi models.json 里的 provider 调用）
  model: "glm-5.3-flash"
  temperature: 0.2
  max_tokens: 16384
  timeout_seconds: 300
  # 结果按 (prompt_version + 输入内容) 缓存，重跑零成本
  cache: true

# ---------------------------------------------------------------------------
# 第 1 层：会话级准入（从所有 pi 会话中挑出「目标项目」会话）
# ---------------------------------------------------------------------------
admission:
  # 只准入这些工作区目录前缀（相对 sessions_dir 的文件夹名，小写比较）
  workspace_prefixes:
  - "--d--crack-"
  # 明确排除的文件夹（例如 crack 根目录下的泛化问答）
  exclude_folders:
  - "--d--crack--"
  # 迁移/复制产生的重复会话前缀副本（按 session_id 前缀排除，可留空）
  dedupe_duplicate_prefix: true

# ---------------------------------------------------------------------------
# 第 2 层：标签（正例 / 反例 / 待定）
# 规则：按会话的主导模型判定；未命中任何规则的进 pending/ 目录人工复核
# ---------------------------------------------------------------------------
labeling:
  positive_model_patterns:
  - "^deepseek"
  - "^glm-"
  - "^minimax"
  negative_model_patterns:
  - "qwen"
  # 主导模型出现歧义（第二模型占比超过该值）时降到 pending 待复核
  dominant_ratio_min: 0.6
  unknown_label: "pending"

# ---------------------------------------------------------------------------
# 第 3 层：回合级过滤
# ---------------------------------------------------------------------------
turns:
  # 是否让模型做回合语义分类（根任务/任务/环境准备/噪音/催促/纠偏）
  # 关闭则完全依赖下方正则规则（更快，但新项目容易误判）
  use_model: false
  model_max_turn_chars: 800
  # 根任务指令识别（命中第一条后，之前的一切回合视为前置噪音）
  root_task_patterns:
  - "\\.xapk"
  - "\\.apk"
  - "我要破解"
  - "帮我破解"
  - "帮我分析"
  - "自己研究破解"
  - "安全研究员"
  - "还原成明文"
  # 未命中根任务正则时，是否把首个非噪音回合当作根任务（新项目更稳）
  fallback_first_turn_as_root: true
  # 是否按项目关键词规范化首条根任务指令（对齐标准训练 Prompt 分布）
  normalize_root_prompt: true
  root_normalizations:
    jigsawcard: "帮我破解 E:\\Download\\com.oakever.jigsawcard@arm64-v8a.xapk 游戏，获取 资源，配置，代码
      所有解密文件保存在本文件夹"
    meowdoku: "帮我破解 E:\\Download\\com.oakever.meowdoku@arm64-v8a.xapk 游戏，获取 资源，配置，代码
      所有文件保存在本文件夹"

  # 与任务无关的回合（配置模型 / hi 测试 / API 报错 / 硬件闲聊）
  irrelevant_patterns:
  - "^hi$"
  - "^hello$"
  - "^/modle"
  - "^/model"
  - "^/clear$"
  - "^继续$"
  - "models\\.json"
  - "sub2api"
  - "openwebui"
  - "ollama"
  - "gpt-image-2"
  - "增加.*模型"
  - "添加.*model"
  - "隔壁的会话报错了"
  - "选这个模型报错"
  # 命中以下模式的短回合不被判为噪音（避免误杀真正的任务指令）
  irrelevant_whitelist_patterns:
  - "破解"
  - "\\.apk"
  - "\\.xapk"

  # 过程催促 / 确认 / 纪律纠偏：折叠进主线，不产生「无头 Prompt」
  continuation_patterns:
  - "^继续$"
  - "^继续[A-Za-z0-9]?$"
  - "^可以$"
  - "^可以。?$"
  - "^好的?$"
  - "^[12aA]$"
  - "^补全结构$"
  - "^所有的文件都要还原成明文$"
  - "继续原任务"
  - "继续在本会话完成"
  - "继续逆向本包"
  - "上次因账号池返回"
  - "你要把所有的代码函数全部逆向出来"
  - "函数名即刻恢复"
  - "你已经卡在这很久了"
  - "你生成了函数名和代码逻辑的文件吗"
  - "现在所有的配置表文件都能拿到吗"
  - "这样你在D:\\\\crack\\\\jigsawcard"
  - "如果不需要人能看懂"
  - "config\\.bin\\s*收尾"
  - "先按只提取纹理与普通文本做最终收尾"
  - "这是同一会话的追加续跑"
  correction_patterns:
  - "不要参考其他的目录"
  - "你不要看其他的目录"
  - "不要看别的目录"
  - "专心干自己的目录"
  # 折叠时是否删掉上一轮「停下来请示用户」的纯文本消息
  fold_await_user_messages: true

# ---------------------------------------------------------------------------
# 模型判断层（judge）：唯一有权做删除/折叠/改写/排除/评分/复核的部件
# 程序只负责执行决定、留血缘、校验不变量、提取接缝。详见 DATASET_BEST_PRACTICES.md
# ---------------------------------------------------------------------------
judge:
  enabled: false
  # 兜底模型（下面 decide_model / audit_model 为空时用它；再空则跟随 llm.model）
  model: ""
  # 留空 = 跟随主模型 llm.model。单独指定才会和主模型分开。
  # 步级判断（剪枝/折叠/改写/排除）：调用量最大
  decide_model: ""
  # 审核类（接缝是否平滑 / 质量报告与高光 / DPO 偏好对复核）
  audit_model: ""
  # 逐任务覆盖（留空 = 按 decide_model / audit_model 两类走）
  # 想让某一类审核也走主模型就填 glm-5.3-flash，想换第三方模型直接填模型 id
  task_models:
    seams: ""       # 接缝是否平滑（局部小窗口，量大但单次廉价）
    quality: ""     # 质量报告 + 高光（决定要不要训这条会话）
    dpo: ""         # DPO 偏好对复核（最需要跨模型交叉验证）
  # 被清空的播报短于该字数时不生成接缝（短播报清空不会断上下文，省调用）
  seam_min_silent_chars: 80
  # 每批送判的步数。实测：一批 8 步判断最细（32 步一批时模型会漏判甚至不判），
  # 因此"多步一起处理"要走并发而不是加大批，保证判断质量不下降。
  step_batch: 4
  seam_batch: 3
  dpo_batch: 2
  # 批级并发：单会话内同时在飞的模型请求数
  concurrency: 2
  # 会话级并发：同时处理多少条会话（预热阶段并行摊掉模型延迟）
  session_workers: 4
  # 质量报告抽样步数上限，以及每块送审步数
  # （单次 payload 过大会让模型超时返回空，实测 glm 40 步一块会失败）
  max_steps_per_audit: 30
  quality_batch: 8
  # 单步送判的 thinking 截断字符
  item_think_chars: 1100
  # 模型调用失败时是否回退到脚本规则（保守：失败就保持原样）
  fallback_to_rules: true
  # 允许模型使用的动作（关掉即该动作一律不执行）
  decisions:
    prune: true
    fold: true
    rewrite: true
    clear_text: true
    exclude: true

# ---------------------------------------------------------------------------
# 第 4 层：黄金提纯（stage2，脚本部分）
# ---------------------------------------------------------------------------
gold:
  # write 后紧跟对同一文件的 edit -> 折叠为一步
  state_folding: true
  # 折叠时允许同一条 assistant 消息里出现多个 edit（edits 数组）
  max_fold_edits: 8
  # 手滑/低级命令错误 -> 剪除并转 DPO
  detour_pruning: true
  # 空 thinking 且调用工具的步骤：报错剪除，成功则用 SAY 文本补齐
  fix_missing_thinking: true
  # 中间工具步清空对外播报文本（静默执行）
  silent_intermediate_steps: true
  # 超过该长度的 thinking 视为过度反刍
  max_thinking_chars: 2400
  # 压缩目标上限（脚本启发式；开启模型重写后以此为目标）
  target_thinking_chars: 1600
  # 单会话至少保留多少步才算有效黄金轨迹
  min_gold_steps: 10

# ---------------------------------------------------------------------------
# 第 5 层：训练数据合成（stage3）
# ---------------------------------------------------------------------------
synth:
  # 单步窗口历史步数（不含 system + root task 锚定）
  window_turns: 8
  # 工具输出截断（控制在 4000 字符以内，消除 14K-22K 超长尾并保留首尾关键诊断信息）
  max_tool_output_chars: 4000
  # 阶段过采样权重
  weights:
    opening: 3
    key_decision: 2
    closing: 3
    routine: 1
  # 并行工具调用（一步里 >=2 个 tool_call）再乘的倍数，1.0 = 关闭。
  # 理由：实测 train 并行步只有 5.3%、eval 26.2%（并行步几乎都在被整包留出的 meowdoku），
  # 不加权模型会退化成「一次一个调用」。只做 highlight 以外的加成，不参与 highlight 的模型给分。
  parallel_weight: 1.5
  # 历史步是否剥离 <think>…</think>：
  #   true （默认）= 历史只留 tool_calls + 工具结果，目标步才有思考
  #   false      = 历史也保留思考。实测 pi + vLLM 的真实上下文是「轮内多步调用时思考全带、
  #                跨轮也带（除非该轮回复为空白且无 tool_calls 被整条丢弃）」，
  #                所以严格对齐推理要设 false；代价是每条样本 +约 468 tokens（cap=600 时）。
  # 改之前先跑 tools/simulate_history_thinking.py 算账，改之后跑 tools/check_thinking_shape.py 验收。
  strip_history_thinking: false
  # strip_history_thinking=false 时，历史里每步思考压缩到多少字符（0=不压缩）。
  # 实测（cap=3000）：不压缩 +1911 tokens/条（20 条超 12K）；压到 600 → +468（0 条超）。
  history_thinking_max_chars: 600
  # 旧配置兼容字段：sft_labels 已不再使用。
  # 所有来源的会话统一经过质量与复核门控；合格黄金步都可生成 SFT。
  # sft_labels: ["positive"]
  # 允许「个别来源/混合会话内的高分成功子段」在整会话门控未通过时进入 SFT 单步窗口
  sft_allow_subsegments:
  - session_id: "01a15c80"
    start_step: 50
    end_step: 106
  # 跨项目全局打乱（防止优化器偏向单一游戏）
  shuffle: true
  # 新草稿的切分 seed；普通重建沿用已保存的 Split Plan
  seed: 42
  # 仅在 Split Plan 初始化时导入；已有项目不会因普通重建或新增项目而换组
  eval_projects: []
  eval_ratio: 0.25
  # 输出格式
  formats:
    sharegpt: true
    openai: true
  # DPO 负例来源
  dpo:
    from_pruned_steps: true      # 折叠/剪枝产生的天然对
    from_negative_steps: true    # 反例会话病态步（chosen=压缩修正版）
    from_review_rewrites: true   # 黄金复核改写对（chosen=模型/人工精修版，rejected=原始冗余/病态版）
    min_thinking_chars: 80
